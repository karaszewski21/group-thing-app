[project]
name = "aj-matcher"
version = "0.1.0"
description = "aj wants matcher process (asyncpg, raw SQL over the backend's DB contract)"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers>=4.8",
    "alembic==1.17.1",
    "sqlalchemy==2.0.44",
    "asyncpg-stubs>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# One event loop for the whole session: the session-scoped asyncpg pool is
# bound to the loop that created it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matcher"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

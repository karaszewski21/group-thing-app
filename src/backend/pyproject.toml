[project]
name = "aj-backend"
version = "0.1.0"
description = "aj backend service (FastAPI / SQLAlchemy / Alembic)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.34",
    "sqlalchemy==2.0.44",
    "asyncpg==0.31.0",
    "alembic==1.17.1",
    "pyjwt>=2.13.0",
    "bcrypt>=4.2",
    "pydantic>=2",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers>=4.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# All async fixtures/tests share one event loop for the whole session — the
# session-scoped `engine`/`postgres_container` fixtures bind asyncpg
# connections to whichever loop is active at first use; a per-test loop
# (pytest-asyncio's default) would tear that loop down between tests while
# the engine's pooled connections are still bound to it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[project]
name = "aj-backend"
version = "0.1.0"
description = "aj backend service (FastAPI / SQLAlchemy / Alembic)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.34",
    "sqlalchemy==2.0.44",
    "asyncpg==0.31.0",
    "alembic==1.17.1",
    "pyjwt>=2.13.0",
    "bcrypt>=4.2",
    "pydantic>=2",
    "pydantic-settings>=2.6",
    "tenacity>=9.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

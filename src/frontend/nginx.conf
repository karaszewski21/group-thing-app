server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-routed SPA (react-router-dom): serve real files/assets as-is;
    # anything else (an app route, or a public /:slug[/grupa/:id[/term/:id]]
    # link) is handed to the backend instead of a plain index.html, so it
    # can inject real Open Graph/Twitter meta tags for link-unfurling bots
    # (see app/system/router.py's public-preview routes) — a real browser
    # gets back the exact same index.html either way.
    location / {
        try_files $uri $uri/ @backend_fallback;
    }

    location @backend_fallback {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

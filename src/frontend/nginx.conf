# Included into the http context (conf.d/default.conf), so the zones,
# maps and log format are declared here. 10 MB holds ~160k client addresses.
limit_req_zone $binary_remote_addr zone=public_reads:10m rate=5r/s;
# The public account-token and unsubscribe routes (each request may mail,
# look up or spend a token), shared per client address across all of them.
limit_req_zone $binary_remote_addr zone=auth_flows:10m rate=10r/m;

# Tokens travel in query strings (/reset-password?token=…) and in the
# unsubscribe path, so the access log records the path without the query
# ($uri, not $request) and masks the unsubscribe token. The referer is not
# logged either, since it can carry a token page's URL.
map $uri $loggable_uri {
    ~^/api/email/unsubscribe/  /api/email/unsubscribe/[redacted];
    default                    $uri;
}

log_format token_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $loggable_uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent" $request_time';

server {
    listen 80;
    server_name _;

    # Set here so it replaces the image's http-level `main` log (which logs
    # $request with the query); every location below inherits it.
    access_log /var/log/nginx/access.log token_safe;

    # Inherited by every location below (none sets its own).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # The public search and the category tree are open to anonymous callers,
    # so both are rate limited per client address.
    location = /api/public/search {
        limit_req zone=public_reads burst=20 nodelay;
        limit_req_status 429;
        error_page 429 @too_many_requests;
        proxy_pass http://backend:8080;
    }

    location = /api/categories {
        limit_req zone=public_reads burst=20 nodelay;
        limit_req_status 429;
        error_page 429 @too_many_requests;
        proxy_pass http://backend:8080;
    }

    # Password reset, address verification and the token lookup. The
    # rejections are logged at info (below the image's notice threshold),
    # because the error log line carries the request line.
    location ~ ^/api/auth/(password-reset|password-reset/confirm|email-verification|email-verification/confirm|account-tokens/lookup)$ {
        limit_req zone=auth_flows burst=5 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        error_page 429 @too_many_requests;
        proxy_pass http://backend:8080;
    }

    # The unsubscribe link (GET redirect and POST). The Mailgun webhook
    # under /api/email/webhooks/ stays on /api/ and is not limited.
    location /api/email/unsubscribe/ {
        limit_req zone=auth_flows burst=5 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        error_page 429 @too_many_requests;
        proxy_pass http://backend:8080;
    }

    # The backend's error envelope, so the frontend shows the message as is.
    location @too_many_requests {
        default_type "application/json; charset=utf-8";
        return 429 '{"status":429,"error":"Too Many Requests","message":"Za dużo zapytań naraz. Odczekaj chwilę i spróbuj ponownie."}';
    }

    location /api/ {
        # Photo uploads (the backend itself caps a photo at 15 MB).
        client_max_body_size 16m;
        proxy_pass http://backend:8080;
    }

    # The GET /oauth2/authorize consent page and its form POST both go to
    # Next; its proxy.ts rewrites the POST to the backend.
    location ~ ^/oauth2/(token|register|introspect)$ {
        proxy_pass http://backend:8080;
    }

    location /.well-known/ {
        proxy_pass http://backend:8080;
    }

    # Pages, /_next assets and public/ files (incl. the plugin contract's
    # /assets/plugin-sdk.js and /assets/plugin-ui.css) are served by Next.
    location / {
        proxy_pass http://web:3000;
    }
}

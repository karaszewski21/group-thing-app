# Included into the http context (conf.d/default.conf), so the zone is
# declared here. 10 MB holds ~160k client addresses.
limit_req_zone $binary_remote_addr zone=public_reads:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # Inherited by every location below (none sets its own).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # The public search and the category tree are open to anonymous callers,
    # so both are rate limited per client address.
    location = /api/public/search {
        limit_req zone=public_reads burst=20 nodelay;
        limit_req_status 429;
        error_page 429 @too_many_requests;
        proxy_pass http://backend:8080;
    }

    location = /api/categories {
        limit_req zone=public_reads burst=20 nodelay;
        limit_req_status 429;
        error_page 429 @too_many_requests;
        proxy_pass http://backend:8080;
    }

    # The backend's error envelope, so the frontend shows the message as is.
    location @too_many_requests {
        default_type "application/json; charset=utf-8";
        return 429 '{"status":429,"error":"Too Many Requests","message":"Za dużo zapytań naraz. Odczekaj chwilę i spróbuj ponownie."}';
    }

    location /api/ {
        # Photo uploads (the backend itself caps a photo at 15 MB).
        client_max_body_size 16m;
        proxy_pass http://backend:8080;
    }

    # The GET /oauth2/authorize consent page and its form POST both go to
    # Next; its proxy.ts rewrites the POST to the backend.
    location ~ ^/oauth2/(token|register|introspect)$ {
        proxy_pass http://backend:8080;
    }

    location /.well-known/ {
        proxy_pass http://backend:8080;
    }

    # Pages, /_next assets and public/ files (incl. the plugin contract's
    # /assets/plugin-sdk.js and /assets/plugin-ui.css) are served by Next.
    location / {
        proxy_pass http://web:3000;
    }
}

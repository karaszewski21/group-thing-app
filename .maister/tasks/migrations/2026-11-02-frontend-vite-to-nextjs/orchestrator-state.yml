      summary: 'All 17 groups done: the app runs on Next 16.4.4 (62 pages, proxy.ts, server metadata + palette, Emotion SSR registry, standalone deploy behind nginx); final gate green (vitest 1469, 0 regressions; pytest 1138/0; tsc 0; eslint 13; ruff 76; mypy 15). C0-C6 committed, B1-D uncommitted (user: no commits).'
      decisions:

task:
  title: "Backend service refactor toward DDD / clean architecture"
  description: >
    Refactor src/backend/app: split large files (especially oversized services) into
    smaller focused modules. Apply DDD and clean-architecture patterns where reasonable.
    Backend only. No behavior change intended. Goal: reduce spaghetti / oversized files.
  status: in_progress
  tags: [refactor, ddd, clean-architecture, backend]
  priority: medium

migration_context:
  migration_type: architecture
  current_system:
    description: "FastAPI microkernel backend with per-vertical packages (router/service/schemas/models). Several services grown oversized."
    technologies: [Python 3.12, FastAPI, SQLAlchemy 2.0 async, Pydantic v2, Alembic, PostgreSQL]
  target_system:
    description: "Same stack; services decomposed into cohesive modules with clearer DDD bounded-context / layered boundaries."
    technologies: [Python 3.12, FastAPI, SQLAlchemy 2.0 async, Pydantic v2, Alembic, PostgreSQL]
  migration_strategy:
    approach: incremental
    phases: []
  risk_level: medium-high
  breaking_changes: []
  rollback_plan_created: true
  dual_run_configured: false
  task_characteristics:
    has_reproducible_defect: false
    modifies_existing_code: true
    creates_new_entities: false   # no DB entities / DDD aggregates; ~30-40 new structural modules
    involves_data_operations: false
    ui_heavy: false
  per_vertical_risk:
    core/auth_deps: low
    families: low-medium
    circulation: medium-high
    groups: high


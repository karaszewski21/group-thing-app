task:
  title: "Wizualizacja grupy zajęciowej (widok kołowy / boisko / stół)"
  description: >
    Ekran wizualizacji grupy zajęciowej na bazie makiet z ux-grup/
    (default.png, boisko.png, table.png). Widok pokazuje uczestników grupy
    rozmieszczonych wokół/na prowadzącej osoby w 3 trybach layoutu
    (mandala/koło, boisko piłkarskie z pozycjami, stół), z ikonami
    "udostępnia rzecz" / "przynosi na zajęcia" przy każdym uczestniku, plus
    kartę szczegółów wybranej rodziny na dole z sekcją "do wymiany w grupie"
    i akcjami Napisz/Biorę.

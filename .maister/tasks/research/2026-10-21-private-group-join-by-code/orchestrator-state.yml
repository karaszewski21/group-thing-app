    source: planner
  phase_summaries:
    phase-1:
      summary: 'Removal map of ''poproś o dostęp'' (13 backend modules, 23 frontend files, 7 backend test files) and a join-by-code design: plaintext groups.join_code verified per group, lazy generation,
        organizer-only rotation, in-process attempt limiter with 429; 9 digits adequate only with the limiter, else 8-char Crockford Base32.'
      steps_completed:
      - init
      - plan
      - gather
      - synthesize
      decisions:
      - decision: Weryfikacja kodu per grupa (POST /api/groups/public/{id}/join-code)
        rationale: cel ataku to jeden kod, pełna przestrzeń 10^9; brak potrzeby globalnego indeksu unikalnego
      - decision: Kod w plaintext na groups
        rationale: organizator musi go podejrzeć i skopiować; hash wyklucza ten UX, a sekret ma niską wartość i jest odwoływalny przez regenerację
      - decision: Leniwe get-or-create przy GET /api/groups/{id}/join-code
        rationale: brak backfillu i brak nowego efektu ubocznego przy tworzeniu/przełączaniu widoczności
      - decision: Limiter prób w procesie + nowy wyjątek/handler 429
        rationale: spójne z jednoinstancyjnymi magazynami OAuth2 w pamięci; licznik w DB walczyłby z blokadą optymistyczną updated_at na groups
      - decision: 'Kolejność błędów: 401 → 404 (grupa nieznana/usunięta/PUBLIC) → 429 → 409 (zły kod, jeden komunikat PL) → 200 (idempotentne, także dla członka)'
        rationale: spójna polityka 404-przed-403 i idempotencja
      - decision: 'Migracje: 0059 (dodanie groups.join_code) przed 0060 (drop group_join_requests + notifications.join_request_id + usunięcie wierszy GROUP_JOIN_%)'
        rationale: kolejność zależności FK i rozdzielenie zmian addytywnych od destrukcyjnych
      risks:
      - Istniejące wiersze PENDING w group_join_requests przepadają przy dropie; jedyna alternatywa to skrypt zatwierdzający je przez stare approve_join_request przed wdrożeniem.
      - Brak ograniczenia unikalności aktywnych Membership (OQ-8) — podwójne wysłanie kodu może utworzyć dwa aktywne wiersze; jedyna ochrona to _is_active_member + blokada przycisku w trakcie żądania.
      - returnTo nie jest walidowane jako ścieżka same-origin (OQ-10) — link ?code= przechodzący przez logowanie dziedziczy ryzyko open redirect.
      - Luki prywatności poza /access (/api/terms, /api/pledges, /api/needed-items, lista członkostw — OQ-9) pozostają nietknięte.
      - 'Wybór 9 cyfr vs 8 znaków Crockford jest decyzją produktową: 9 cyfr tylko z limiterem; external-product-patterns.md nie powstał, więc odniesienia do Google Classroom/Slack są z drugiej ręki.'

task:
  title: Dołączanie do grupy prywatnej przez kod (zastąpienie 'poproś o dostęp')
  description: 'Poprawić zapisywanie się na termin do grupy prywatnej: dostęp przez kod (wzorzec z innej aplikacji: 9-cyfrowy kod wygenerowany/udostępniony przez organizatora) zamiast obecnego ''wyślij

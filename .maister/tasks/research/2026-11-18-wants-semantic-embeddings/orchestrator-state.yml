task:
  title: Semantyczne dopasowanie Szukam przez embeddingi + pgvector
  status: completed
research_context:
  research_type: mixed
  research_question: How should the Szukam matcher add semantic matching with a small embedding model and pgvector, so that synonyms and close meanings match, and what does it cost?
  scope:
    included:
    - model choice for Polish short texts
    - threshold method
    - DB schema and HNSW index
    - compute pipeline in the backend outbox worker
    - matcher integration as a bell-less third tier
    - cost on VPS A
    - risks and rollout
    excluded:
    - LLM query expansion
    - LLM pair judging
    - GPU hosting
    - semantic search on /api/public/search
    constraints:
    - CPU only
    - matcher stays asyncpg-only without ML dependencies
    - never print secrets
  project_doc_paths:
  - .maister/docs/project/tech-stack.md
  - .maister/docs/project/architecture.md
  methodology:
  - parallel gathering (4 categories)
  - verification against model cards, leaderboards and the pg18 image
  - synthesis mapped onto the 0099 contract
  sources: []
  confidence_level: medium
  gathering_strategy:

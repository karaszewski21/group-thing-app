    phase-2:
      summary: Brainstorming and design both enabled by user.
      decisions:
      - decision: Brainstorming enabled
        rationale: 'User choice; open areas: flow, handoff, linking, role'
      - decision: Design enabled
        rationale: User choice; feeds development workflow
      risks: []
      artifacts: []
    phase-3:
      summary: 20 alternatives in 5 areas; recommended 1A GIS popup / 2A JSON / 3A refuse 409 / 4C always GUEST / 5B lean MVP; 14 deferred ideas.
      decisions:
      - decision: Browser flow 1A (GIS popup + ID token + nonce cookie).
        rationale: It keeps the in-page `AuthSheet` login on six public surfaces, needs no client secret or redirect URIs, and has the fewest routes (2).
      - decision: Handoff 2A (JSON `{token, created, party_id}` in the POST response).
        rationale: The frontend stays the single session writer, no token appears in a URL and there is no server store.
      - decision: Collision policy 3A (409 "zaloguj się hasłem", no merge).
        rationale: aj never verifies emails and cannot revoke JWTs, so every merge-by-email variant opens the USENIX 2022 pre-hijack.
      - decision: Role 4C (always GUEST, no `role` parameter).
        rationale: This matches password registration as it exists today, and the organizer path (founding an Organization) already exists.
      - decision: Scope 5B.
        rationale: v1 has sign-in and sign-up, two migrations, the verifier, resolver and button, the deploy config and the docs. Linking/unlinking from settings, avatar import, setting a password, RISC
          and Facebook are deferred.
      risks:
      - '**Owner call on area 1**: is the Google-rendered button acceptable, or is the custom pill a hard requirement? Is Facebook due in the next iteration? A "yes" to either flips the choice to 1B + 2B.'
      - '**Popup blocking in in-app browsers** (Instagram, Messenger and others) with 1A. It is not measured. If it shows up in practice, the fallback is 1E (adding the code flow next to the popup).'
      - '**The GIS iframe inside the focus-trapped `AuthSheet`** (`trapFocus.ts`) and at narrow mobile widths has not been tried.'
      - '**Strict 409 friction**: existing password users who click Google get a refusal until "Połącz z Google" (deferred, D1) ships. Clear Polish copy is the mitigation.'
      - '**Production prerequisites outside the code**: a domain, `/about/privacy` and a homepage are needed for brand verification. They block a branded production consent screen, but not the development
        work.'
      - '**Accepted risks**: no session revocation (1 h JWT) and no recovery for Google-only users who lose their Google account.'
      artifacts:
      - path: outputs/solution-exploration.md
        label: Solution exploration
        html: outputs/solution-exploration.html

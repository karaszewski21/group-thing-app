    phase-5:
      summary: Thin identity-provider adapter in app/auth on the existing FastAPI monolith; 10 components, 9 ADRs, 11 integration points.
      architecture_style: thin identity-provider adapter on the existing layered FastAPI monolith
      decisions_count: 9
      decisions:
      - decision: GIS popup with a server-issued nonce cookie
        rationale: keeps the in-page `AuthSheet` login on six public surfaces with no client secret or redirect URIs (ADR-001).
      - decision: Token returned in the JSON body
        rationale: the frontend stays the only session writer and no token appears in a URL (ADR-002).
      - decision: Separate `user_identities` table keyed on (provider, subject)
        rationale: email is only a hint, and the table fits later providers (ADR-003).
      - decision: Nullable `password_hash` with a guarded downgrade
        rationale: Google-only accounts have no password; the old image would 500 on them (ADR-004).
      - decision: No auto-linking by email
        rationale: aj never verifies emails and cannot revoke JWTs, so any merge opens the pre-account-hijack (ADR-005).
      - decision: Every Google sign-up starts as GUEST
        rationale: parity with password registration, no speculative `role` input (ADR-006).
      - decision: '`pyjwt[crypto]` as the verifier'
        rationale: an extra of a library already in use, the smallest dependency that does RS256 (ADR-007).
      - decision: Code in `app/auth` plus a shared `bootstrap_person_account` in the users context, permissions read from the DB (ADR-008).
        rationale: ''
      - decision: Lean complete MVP behind a presence gate on the client ID (ADR-009).
        rationale: ''
      risks:
      - '**Popup blocking in in-app browsers** (Instagram, Messenger) is unmeasured. Mitigation path: the code-flow fallback (deferred D6).'
      - '**GIS iframe inside the focus-trapped `AuthSheet`** and at narrow mobile widths is untested. It needs a manual check on mobile during implementation; Tab order may skip the iframe.'
      - '**`Secure` flag on the nonce cookie**: uvicorn trusts no proxy headers, so the request scheme behind the TLS terminator is `http`. The specification has to pick how `Secure` is decided (a fixed
        rule such as "always Secure except plain-http localhost", or a configured value). It must not come from untrusted headers.'
      - '**409 friction**: existing password users who press the Google button are refused until "Połącz z Google" (D1) ships. The Polish copy has to say what to do.'
      - '**Accepted risks**: login JWTs cannot be revoked (up to 1 h after any account change), and a Google-only user who loses their Google account has no recovery path (no password set or reset yet).'
      - '**Production prerequisites outside the code**: a domain, a privacy-policy page and a homepage for Google brand verification (D14). They block a branded production consent screen, not development.'
      - '**Terms/consent notice**: whether password registration shows one was not researched. The Google button must show the same notice if it does.'
      artifacts:
      - path: outputs/high-level-design.md
        label: High-level design
        html: outputs/high-level-design.html
      - path: outputs/decision-log.md
        label: Decision log
        html: outputs/decision-log.html

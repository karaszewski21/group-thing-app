  phase_summaries:
    phase-1:
      summary: Google sign-in ends in existing encode_login_token/applyToken path; user_identities (0107) + nullable password_hash (0108); no email auto-linking; pyjwt[crypto]; flow A (GIS popup) recommended
        over B (code flow).
      steps_completed:
      - initialize
      - plan
      - gather
      - synthesize
      decisions:
      - decision: Reuse `encode_login_token` and JSON token delivery.
        rationale: Every consumer (session, cookie, consent `_token`, plugin SDK) keys off `token`, and the backend has never set cookies.
      - decision: Use a separate, provider-generic `user_identities` table, with unique `(provider, subject)`.
        rationale: Per OIDC Core §5.7, `sub` is the only stable key. It also leaves room for Facebook later.
      - decision: Never link by email automatically.
        rationale: Password sign-up never verifies email, so merging is the classic-federated-merge pre-hijack, and stateless JWTs can't be revoked to contain it.
      - decision: The dependency is `pyjwt[crypto]`, not google-auth or Authlib.
        rationale: PyJWT is already the JWT library, `cryptography` is absent from `uv.lock` and RS256 needs it, and the alternatives add more packages or a session middleware.
      - decision: Read permissions from the DB (`_load_permissions`), not from register's hard-coded `["READ","EDIT"]`.
        rationale: Otherwise admins signing in with Google lose ADMIN.
      - decision: Recommend flow A (GIS popup + server-issued nonce) over B (code flow).
        rationale: 'This is a recommendation, not a decision: A keeps `AuthSheet` in-page and needs no secret, while B keeps the custom button, loads no third-party script and is provider-generic.'
      risks:
      - '**Owner decision**: flow A or B (§7.2). Also whether the custom pill button is a hard requirement. If it is, choose B.'
      - '**Production prerequisites outside the code**: the public domain, a privacy policy and a homepage on a verified domain (needed for Google brand verification). None of these exist in the repo yet.'
      - '**No session revocation**: unlinking, deletion or a Google `sessions-revoked` event cannot end a live JWT before `exp` (default 1 h). This is an accepted MVP risk.'
      - '**No password reset**: a Google-only user who loses their Google account cannot recover the aj account.'
      - '**Role at sign-up**: GUEST or ORGANIZER is chosen in `RegisterForm`, but the Google button sits above both tabs. The proposal is an optional `role` (default GUEST) that is honoured only when an
        account is created.'
      - '**Untested UX**: the GIS iframe button inside the focus-trapped `AuthSheet`, and popup blocking in in-app browsers (flow A).'
      artifacts:
      - path: planning/research-brief.md

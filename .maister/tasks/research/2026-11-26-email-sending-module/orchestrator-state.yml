task:
  title: "Moduł mailingowy — zewnętrzny dostawca + przegląd momentów wysyłki"
  description: "Wdrożenie modułu wysyłki e-maili z systemu z użyciem zewnętrznego serwisu oraz przegląd aplikacji: gdzie i w jakich momentach powinny wychodzić maile."
  status: completed
  tags: [email, notifications, integration, research]
  priority: null
research_context:
  research_type: mixed
  research_question: "Jak wdrożyć moduł wysyłki e-maili w aj (FastAPI + Next.js) z użyciem zewnętrznego dostawcy i w jakich momentach aplikacji maile powinny być wysyłane?"
  scope:
    included:
      - "Porównanie zewnętrznych dostawców e-mail transakcyjnych (API/SMTP) pod kątem EU/RODO, ceny, deliverability, Python SDK, webhooków"
      - "Wzorzec integracji z istniejącą architekturą (outbox, notifications, scheduled jobs, ACL, config)"
      - "Inwentarz zdarzeń w aplikacji kandydujących do e-maila (auth, rezerwacje, terminy, eventy, wants, wiadomości, punkty, grupy)"
      - "Preferencje/wypisy, szablony PL, DNS (SPF/DKIM/DMARC), bounce/complaint handling"
    excluded:
      - "Implementacja kodu"
      - "Masowy marketing / newslettery (poza notą o przyszłości)"
      - "SMS / push"
    constraints:
      - "Użytkownicy w Polsce, treści po polsku, RODO"
      - "Deploy na VPS (docker compose), mała skala"
      - "Sekrety tylko w .env, nigdy w artefaktach"
  methodology: [targeted-codebase-reading, grep-sweeps, official-docs-review, weighted-provider-matrix]
  sources: []
  confidence_level: medium-high
  project_doc_paths:
    - .maister/docs/project/architecture.md
    - .maister/docs/project/tech-stack.md
  gathering_strategy:
    categories: [codebase-notifications-outbox, codebase-triggers, external-providers, external-practices, prior-decisions-frontend]
    count: 5
    source: planner
  phase_summaries:
    phase-1:
      summary: "Phase 1 complete: Mailgun EU recommended (Resend alt), app/email hooked into notifications.service with own email_messages queue; MVP = 3 auth mails + 7 bell kinds. Confidence medium-high."
      steps_completed: [step-1-init, step-2-plan, step-3-gather, step-4-synthesize]
      decisions:
        - decision: "Dostawca: Mailgun EU, a przy miękkiej rezydencji Resend"
          rationale: "Mailgun ma najwyższy wynik ważony (81/100), a dane wiadomości, logi i suppression są w regionie EU. Resend wygrywa DX-em (24 h `Idempotency-Key`, Svix), ale przechowuje metadane w USA."
        - decision: "Punkt wpięcia: `notifications.service` (jedyny wspólny punkt wszystkich 13 rodzajów bell), plus ACL-e z `users`/`auth` dla maili bez bell"
          rationale: "9 z 13 rodzajów bell nie przechodzi przez outbox, więc handler na istniejących zdarzeniach (ADR-009) pominąłby większość."
        - decision: "Własna kolejka `email_messages` + job `_run_email_send` zamiast handlera na wpisie `outbox_entries`"
          rationale: "dispatcher ma 5 prób bez backoffu (~5 min do FAILED) i przy błędzie jednego handlera powtarza wszystkie, więc zdublowałby bell. Kolejka daje też opóźnienia, ciszę nocną i throttling."
        - decision: "Zasada „najpierw bell”: każdy mail-powiadomienie ma swój `NotificationKind`. Nowe triggery (zmiana terminu, anulowanie przez drugą stronę) zaczynają się od nowego bell"
          rationale: "jedna ścieżka, a luka znika też w aplikacji."
        - decision: "Mail serwisowy bez zgody z PKE, z preferencją per kategoria i nagłówkami List-Unsubscribe"
          rationale: "art. 398 PKE dotyczy tylko informacji handlowej, a podstawą jest art. 6(1)(b) RODO. To korekta „opt-in + `email_consent_at`” z ADR-009 (pewność średnia)."
        - decision: "HTTP API przez `httpx` bez SDK dostawcy, szablony Jinja2 (nowa zależność) w repo, nie u dostawcy"
          rationale: "minimalne zależności, testowalność, polskie teksty pod code review, wymiana dostawcy to jeden adapter."
        - decision: "Tokeny weryfikacji i resetu losowe, jednorazowe, hashowane w DB. Link wypisu podpisany osobnym `EMAIL_LINK_SIGNING_SECRET`"
          rationale: "rotacja `JWT_SECRET` nie może psuć linków wypisu w starych mailach."
      risks:
        - "**Decyzja właściciela:** czy rezydencja danych w UE jest twarda (Mailgun EU, ewentualnie Brevo lub Scaleway przy wymogu dostawcy z UE), czy wystarczy DPA z SCC (Resend)?"
        - "**Decyzja właściciela/prawnika:** domyślne włączenie kategorii powiadomień po weryfikacji adresu (rekomendacja) czy opt-in. Brak wytycznych UODO dla maili powiadomień, więc podstawa 6(1)(b) ma pewność średnią. Mail z MATCH to szara strefa. SUGGESTION/SIMILAR zostają tylko w aplikacji."
        - "Brak polityki prywatności i regulaminu (Google D14). Informacja z art. 13 RODO musi wskazać dostawcę jako procesora, a przy Resend także transfer do USA."
        - "Bell może trafić do party typu Organization, a ta nie ma adresu. Reguła wyboru odbiorcy jest nieustalona. Na razie pomijamy (SKIPPED)."
        - "Reset hasła dla konta tylko-Google (`password_hash IS NULL`) to w praktyce „ustaw pierwsze hasło” (D4). Trzeba zdecydować produktowo."
        - "Darmowy plan Mailgun ma limit 100 dziennie. Większa grupa może go przekroczyć, wtedy trzeba przejść na Basic ($15). Na Mailgun możliwe są duplikaty przy awarii między 2xx a commitem (brak natywnej idempotencji)."
        - "Ceny Brevo, Scaleway i MailerSend są niezweryfikowane lub sprzeczne. Brak niezależnego benchmarku deliverability z 2026 r. Przed startem trzeba zrobić test seed."
      artifacts:
        - path: analysis/synthesis.md
          label: Synthesis
          html: null
        - path: outputs/research-report.md
          label: Research report
          html: "outputs/research-report.html"
    phase-3:
      summary: "8 decision areas, 32 alternatives; recommended package: Mailgun EU, notifications.service hook + email_messages queue, opt-out per category, verification for P/D, Jinja2, immediate send + throttling, webhooks for hard bounces/complaints."
      decisions:
        - decision: "Dostawca: Mailgun EU, a Resend tylko przy świadomie miękkiej rezydencji"
          rationale: "dane wiadomości, logi i suppression Mailgun EU zostają w regionie. Brak natywnej idempotencji kompensuje klucz w `email_messages` (raport §5.3, F9)."
        - decision: "Punkt wpięcia: bezpośredni INSERT do `email_messages` w `create_notification(s)`, bez przeskoku przez `outbox_entries`"
          rationale: "rekord kolejki zapisany w transakcji domeny sam jest transactional outboxem. Dispatcher nie ma backoffu i powtarza wszystkie handlery wpisu (F1, F2)."
        - decision: "Zgoda i preferencje: mail serwisowy bez zgody z PKE, opt-out per kategoria, domyślnie włączone po weryfikacji adresu (poza podsumowaniami organizatora)"
          rationale: "art. 398 PKE dotyczy informacji handlowej, a zgoda wpleciona w rejestrację byłaby niedobrowolna (F11)."
        - decision: "Weryfikacja: wymagana dla P i D, backfill `email_verified_at` z tożsamości Google, istniejące konta z hasłem zachęcane banerem w panelu"
          rationale: "bez masowej wysyłki na start (warm-up, F10)."
        - decision: "Odbiorca Organization: SKIPPED z `skip_reason` w MVP"
          rationale: "reguła „założyciel/liderzy” wymaga osobnej decyzji produktowej i prześledzenia `owner_party_id`."
        - decision: "Reset dla konta tylko-Google: pozwolić ustawić pierwsze hasło linkiem z maila"
          rationale: "zamyka zaakceptowane ryzyko braku odzyskiwania. Kontrola nad skrzynką i tak daje dziś kontrolę nad kontem Google (Insight 5)."
        - decision: "Szablony: Jinja2 (`select_autoescape`, `StrictUndefined`) w repo, pary `html.j2`/`txt.j2`"
          rationale: "teksty PL przechodzą code review, a zmiana dostawcy to tylko nowy adapter (F12)."
        - decision: "Batching: wysyłka natychmiastowa z kluczami throttlingu (`want_match:<want>:<dzień>`) i ciszą nocną 22–07, bez digestów w MVP"
          rationale: "wszystkie rodzaje z MVP wymagają reakcji albo zmieniają zobowiązanie, a `send_after` zostawia drogę do koalescencji później."
        - decision: "Webhooki w MVP: tylko `failed`/permanent i `complained` (HMAC) zasilające `email_suppressions`, bez śledzenia `delivered`"
          rationale: "to minimum potrzebne do ochrony reputacji. Status dostarczenia nie zmienia żadnej decyzji w aplikacji."
      risks:
        - "Twarda czy miękka rezydencja danych w UE (R1). Od niej zależy wybór Mailgun EU lub Resend. Przy wymogu „dostawca z UE” w grę wchodzą Brevo albo Scaleway, z niezweryfikowanymi cenami i webhookami."
        - "Domyślne włączenie kategorii (zwłaszcza „Szukam”/MATCH, szara strefa prawna). Jeśli prawnik oceni MATCH jako bliższe marketingowi, kategoria „Szukam” przechodzi na opt-in (alternatywa 3D)."
        - "Okno duplikatu na Mailgun (crash między 2xx a commitem). Akceptowane dla P, a dla T zamieniane na FAILED. Jeśli okaże się nieakceptowalne, to argument za Resend (`Idempotency-Key`)."
        - "Darmowy limit Mailgun 100 dziennie. `EMAIL_DAILY_CAP` może przy większej grupie zacząć odrzucać (SKIPPED) powiadomienia. Wtedy plan Basic ($15)."
        - "Rzeczy należące do Organization (`owner_party_id`) nie dostaną maila o przejęciu lub propozycji. To realna luka, jeśli organizacje wystawiają dużo rzeczy."
        - "Polityka prywatności (D14) jest warunkiem wstępnym każdego wariantu. Przy Resend musi wskazać transfer do USA."
        - "`WANT_EXPIRING` ignoruje `wants.notifications_enabled`. Mail powinien respektować wyciszenie (rekomendacja), ale to rozjazd z bell."
      artifacts:
        - path: outputs/solution-exploration.md
          label: Solution exploration
          html: "outputs/solution-exploration.html"
    phase-4:
      summary: "All 8 areas converged: Mailgun EU, hook + email_messages queue, opt-out per category, verification for P/D with banner, SKIPPED for address-less recipients, Jinja2, immediate send with throttling + quiet hours, full webhook incl. delivered (user override of 8B)."
      decision_areas:

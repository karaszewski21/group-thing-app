        - decision: "D5 Odbiorca: 5A SKIPPED ze skip_reason (Organization/dziecko/niezweryfikowany); rodzina SKIPPED; Google-only może ustawić pierwsze hasło"
          rationale: "user choice at convergence"
        - decision: "D6 Szablony: 6A Jinja2 w repo (autoescape, StrictUndefined, html.j2/txt.j2)"
          rationale: "user choice at convergence"
        - decision: "D7 Batching: 7A natychmiast + klucze throttlingu (MATCH ≤1/dzień/want) + cisza nocna 22–07, bez digestów"
          rationale: "user choice at convergence"
        - decision: "D8 Webhooki: 8A pełny webhook (delivered, failed, complained) + status w email_messages — wybór użytkownika zamiast rekomendowanego 8B"

    phase-5:
      summary: "Module inside the modular monolith: app/email with email_messages queue as transactional outbox, send job, Mailgun EU adapter, full webhook; 10 ADRs, migrations 0109–0111, matrix rows 74–80, 3 rollout stages."
      architecture_style: "module in modular monolith (ACL + DB queue as transactional outbox)"
      decisions_count: 10
      decisions:
        - decision: "Mailgun EU przez `httpx` bez SDK, za portem `EmailSender`"
          rationale: "wiadomości, logi i suppression zostają w regionie EU, a zmiana dostawcy to jeden adapter (ADR-002)."
        - decision: "Hook w `notifications.service` + jeden `INSERT … ON CONFLICT DO NOTHING` do `email_messages` w transakcji domeny"
          rationale: "jedyny punkt, przez który przechodzi każdy bell, a sam wiersz kolejki jest transactional outboxem. Bez trzeciego przeskoku przez `outbox_entries` (ADR-003)."
        - decision: "Job z późnym wiązaniem, backoffem i polityką „zawieszonego SENDING” (P/D wracają do PENDING, T idą do FAILED)"
          rationale: "dispatcher outboxa nie ma backoffu i powtarza wszystkie handlery (ADR-004)."
        - decision: "Opt-out per kategoria, domyślnie włączone po weryfikacji. „Szukam” można przełączyć na opt-in jedną stałą. Wypis jednym kliknięciem przez podpisany token"
          rationale: "mail serwisowy nie jest informacją handlową z art. 398 PKE (ADR-005)."
        - decision: "`user_profiles.email_verified_at`, backfill z tożsamości Google, losowe hashowane tokeny w `account_tokens`, baner zamiast masowej kampanii (ADR-006)."
          rationale: ""
        - decision: "Odbiorca bez własnego zweryfikowanego adresu dostaje SKIPPED z `skip_reason`. Konto tylko-Google może ustawić pierwsze hasło linkiem resetu, a API zawsze odpowiada neutralnym 202 (ADR-007)."
          rationale: ""
        - decision: "Jinja2 w repo z jednym generycznym szablonem powiadomienia renderowanym ze snapshotu bell"
          rationale: "bez ACL-i do domen na potrzeby treści (ADR-008)."
        - decision: "Wysyłka natychmiastowa, MATCH dławiony kluczem dziennym per want, cisza nocna 22–07 dla P/D, `EMAIL_DAILY_CAP` na warm-up, bez digestów (ADR-009)."
          rationale: ""
        - decision: "Pełny webhook Mailgun (8A, wybór użytkownika zamiast rekomendowanego 8B) ze statusami DELIVERED/BOUNCED/COMPLAINED (ADR-010)."
          rationale: ""
        - decision: "Handover ADR-009 (2026-10-13): kierunek potwierdzony, punkt wpięcia, dedupe i model zgody zmienione, uwaga o pollerze moderacji nieaktualna (ADR-001)."
          rationale: ""
      risks:
        - "DPA Mailgun/Sinch i lista podprocesorów nie zostały przeczytane. Mailgun Technologies to spółka z USA (teoretyczny CLOUD Act). Trzeba to sprawdzić przed etapem 1."
        - "Domyślne włączenie kategorii, zwłaszcza „Szukam” (szara strefa prawna), wymaga opinii prawnej. Przejście na opt-in to zmiana jednej stałej."
        - "Okno duplikatu na Mailgun (crash między 2xx a commitem): dla P/D możliwy podwójny mail, dla T FAILED."
        - "Darmowy limit Mailgun to 100 dziennie. Przy `EMAIL_DAILY_CAP` nadmiarowe P/D dostają SKIPPED (`daily_cap`), więc wzrost wymaga planu Basic. Pełny webhook nie zużywa limitu wysyłki, ale zwiększa ruch przychodzący."
        - "Rzeczy należące do Organization nie dostaną maili (SKIPPED `organization`). Lukę mierzymy przez `skip_reason`, reguła powstanie w osobnym zadaniu."
        - "Polityka prywatności (D14) jest warunkiem etapu 2. Musi wskazać Mailgun jako procesora i retencję logu wysyłek."
        - "Throttling MATCH wymaga przekazania `want_id` do kolejki. Nowe pole `topic_id` w `NotificationEntry` (tylko w pamięci, nie w tabeli `notifications`) trzeba potwierdzić w specyfikacji."
        - "Ochrona przed replay webhooka (okno czasu + pamięć tokenów w procesie) zakłada jedną instancję backendu. Druga instancja wymagałaby tabeli tokenów."
        - "Każdy zapis zmieniający `user_profiles.email` (dziś bez flow zmiany adresu, ale z możliwą ścieżką przez rodziny/opiekunów) musi czyścić `email_verified_at`. Specyfikacja musi to prześledzić."
        - "Reset hasła nie unieważnia wydanych JWT (zaakceptowane ryzyko „brak revocation”, bez zmian)."
      artifacts:
        - path: outputs/high-level-design.md
          label: High-level design
          html: "outputs/high-level-design.html"
        - path: outputs/decision-log.md
          label: Decision log
          html: "outputs/decision-log.html"

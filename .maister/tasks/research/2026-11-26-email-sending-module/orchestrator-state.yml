        - area: "D4 Weryfikacja i rollout"
          alternatives_count: 4
          chosen_approach: "4A weryfikacja wymagana dla P/D, backfill Google, baner w panelu"
        - area: "D5 Odbiorca"
          alternatives_count: 4
          chosen_approach: "5A SKIPPED ze skip_reason (Organization/dziecko/niezweryfikowany); rodzina SKIPPED; Google-only może ustawić pierwsze hasło"
        - area: "D6 Szablony"
          alternatives_count: 4
          chosen_approach: "6A Jinja2 w repo (autoescape, StrictUndefined, html.j2/txt.j2)"
        - area: "D7 Batching"
          alternatives_count: 4
          chosen_approach: "7A natychmiast + klucze throttlingu (MATCH ≤1/dzień/want) + cisza nocna 22–07, bez digestów"
        - area: "D8 Webhooki"
          alternatives_count: 4
          chosen_approach: "8A pełny webhook (delivered, failed, complained) + status w email_messages — wybór użytkownika zamiast rekomendowanego 8B"
      deferred_ideas:
        - "Przypomnienie wieczorem przed terminem/wydarzeniem (C4)"
        - "Mail o nowej wiadomości czatu z opóźnieniem (C6, wymaga 7C)"
        - "Digest organizatora"
        - "Digest MATCH (7D)"
        - "Zmiana adresu e-mail (A7)"
        - "Auto-linking Google po weryfikacji"
        - "Zaproszenie opiekuna z ustawieniem hasła (A8)"
        - "Mail po odrzuceniu mediów (C15), potwierdzenie płatności (C9) — najpierw bell"
        - "mailto: w List-Unsubscribe"
        - "Podgląd szablonów / log wysyłek w UI admina"
        - "Wersje językowe szablonów"
        - "Usuwanie konta z obsługą email_suppressions"
      decisions:
        - decision: "D1 Dostawca: 1A Mailgun EU"
          rationale: "user choice at convergence"
        - decision: "D2 Punkt wpięcia i kolejka: 2A hook w notifications.service + INSERT email_messages w tej samej transakcji + job _run_email_send"
          rationale: "user choice at convergence"
        - decision: "D3 Zgoda i preferencje: 3A opt-out per kategoria, domyślnie włączone po weryfikacji"

task:
  title: "Decouple standing-membership promotion from group visibility flip; expose from organizer's own group page"
  description: |
    Implement the fix for use case 1 (ad-hoc music-class sessions ->
    promotable, ongoing, addable standing group) identified by research at
    .maister/tasks/research/2026-09-22-business-model-fit-recurring-groups.

    Approach: decouple "add term attendees as standing members" from the
    PUBLIC->PRIVATE visibility flip (Approach A/B in the research
    synthesis). A PUBLIC group must be able to have standing Membership
    rows while continuing to accept ad-hoc TermAttendance signups for new
    terms -- the two should coexist, not be mutually exclusive.

    Required constraint: the new/adjusted "add standing members from a
    term's attendees" action must be reachable directly from the
    organizer's own group page (src/frontend/src/pages/krag/KragGrupyPage.tsx),
    not only from the internal /panel route's EditTermDialog.

    Use cases 2-4 (family gatherings, teacher's class, football coach's
    team) are already fully supported by the existing PRIVATE-group +
    join_private_group + Membership mechanism per the research -- no
    changes needed there.
  status: completed
  tags: [development, groups, membership, backend, frontend]
  priority: high


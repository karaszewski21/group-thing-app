  scope_expanded: true
  gap_analysis_summary: >
    Risk medium, effort medium. Core coupling break confirmed feasible with
    low architectural impact. Two NEW critical findings beyond prior
    phases: (1) family-less promoted members become invisible in
    KragGrupyPage.tsx's family-orbit display (resolveFamiliesForMemberships
    drops parties with no resolvable Family) -- a display gap that
    undermines the whole point of relaxing the family filter; (2)
    EditTermDialog.tsx has three more family-coupled UI behaviors
    (pre-selection, disabled-checkbox, "brak rodziny" copy) beyond the
    already-known visibility gate, all needing rework together. Two
    "important" open decisions: rename formalize_group_from_term or keep
    name; rewrite existing backend test in place vs. add new tests
    alongside.
  research_reference:
    path: .maister/tasks/research/2026-09-22-business-model-fit-recurring-groups
    research_question: >
      Does the current group-thing-app data model and UX cover ad-hoc
      music-class sign-up, family gatherings, teacher classes, and coach
      teams, and what gap exists in promoting ad-hoc attendees into a
      standing, ongoing, addable group?
    research_type: mixed
    confidence_level: high
  design_reference:
    source: null
    product_design_path: null
    mockup_count: 0
    has_brief: false
    index_path: null
  phase_summaries:
    research:
      summary: >
        Use cases 2-4 (family/teacher/coach) already fully supported by
        PRIVATE-group + join_private_group + Membership. Use case 1
        partially supported: formalize_group_from_term exists and is
        tested but is one-shot, forecloses further ad-hoc signup by
        flipping PUBLIC->PRIVATE, requires a resolvable Family, and is
        reachable only from the internal /panel route. Recommended fix
        (Approach A/B): decouple "add standing members" from the
        visibility flip; keep it available while a group stays PUBLIC;
        expose it from the organizer's own group page.
      key_findings:
        - "Membership (standing) and TermAttendance (ad-hoc) are separate tables with no FK link (models.py:149-170, 239-264)"
        - "formalize_group_from_term (application/memberships.py:125-163) creates Membership rows from term attendees but also flips group.visibility PUBLIC->PRIVATE in the same transaction"
        - "Once PRIVATE, create_rsvp (public_view.py:310-321) rejects new anonymous/non-member RSVPs, foreclosing further ad-hoc signup"
        - "The formalize action is UI-reachable only from components/panel/EditTermDialog.tsx under the internal /panel route, not from KragGrupyPage.tsx"
        - "Formalization requires a resolvable Family per attendee (memberships.py:147-149); solo adults without a Family record are silently unselectable"
        - "No DB constraint ties Membership creation to visibility change -- the coupling is application-layer logic, not structural"
      recommended_approach: >
        Approach A/B: introduce/adjust an application-layer operation that
        creates standing Membership rows from selected term attendees
        WITHOUT changing group.visibility, so a PUBLIC group can keep
        accepting ad-hoc signups while also accumulating standing members.
        Expose this action on the organizer's own group page
        (KragGrupyPage.tsx), in addition to (or replacing) the existing
        /panel-only entry point.

task:
  title: Circulation ledger — księgowanie przepływu rzeczy między magazynami
  description: >
    Poprawić założenia transakcji w app.circulation, bo model się rozjechał. Encje
    Account, CirculationEntry, CirculationTransaction (dziś ledger punktów: +1 dla
    dającego) mają zgodnie z pierwotnym założeniem użytkownika służyć wzorcowi
    accounting do "księgowania" produktów — rejestrowania przepływu rzeczy między
    użytkownikami i ich magazynami. Np. User A oddaje userowi B rzecz X → transakcja:
    X schodzi z magazynu A, dochodzi do magazynu B — kompletna historia produktu.
    Tak samo przy wypożyczeniu (LEND), zwrocie (RETURN) i zamianie (SWAP).
    Wcześniejszy research zaproponował encję Loan (historia, nadpisywanie due_date
    w InventoryBalance) — użytkownik uważa, że to nie trafia w jego intencję.
  status: in_progress
  tags: [circulation, ledger, accounting, inventory, history]
  priority: null


      primary_language: python-fastapi-react-ts
      summary: >
        The requested RSVP-gated lend/return/exchange mechanism does not exist.
        app.circulation (Reservation/InventoryBalance/CirculationTransaction,
        points-for-circulation ledger) is fully built but deliberately global and
        Term-independent (confirmed against docs/system-wypozyczalni-inventory-accounting.md,
        which never mentions Terms/attendance). The only Term bridge today is
        Pledge->fulfill_pledge for organizer-posted NeededItems, unrelated to free
        peer listing. Panel's "Wypożyczę/Oddam/Zamienię" and
        "Pożyczone/Otrzymane/Zamienione" tiles are decorative local-only React
        state, zero backend persistence. New capability needed at the
        app.groups/app.circulation boundary via the existing circulation_bridge
        anti-corruption-layer pattern.
    clarifications:
      - "Listing scope: any of the user's own items, not just Term-needed items (new capability, NeededItem/Pledge flow stays unchanged)"
      - "Browse/take scope: only users with TermAttendance for that exact same Term (not general Circle membership)"
      - "Reuse existing Reservation -> CirculationTransaction points pipeline rather than a simpler parallel mechanism"
      - "Listings auto-disappear once the Term's date has passed or the lister's TermAttendance is withdrawn"
    gap_analysis:
      integration_points:
        - app.groups.infrastructure.circulation_bridge (extend, mirroring pledge_fulfillment.py precedent)
        - app.groups TermAttendance (needs withdrawal capability added)
        - new app.groups entity: TermItemListing (term_id, inventory_item_id/reservation linkage)
      summary: >
        New TermItemListing entity recommended in app.groups (not a column on
        circulation's InventoryItem/Reservation) to preserve circulation's
        documented "given, unchanged" contract. Browse endpoint doesn't exist and
        must be built (GET /api/inventory-items requires a specific inventory_id
        today). No reusable "has TermAttendance" auth primitive exists.
        TermAttendance withdrawal doesn't exist anywhere (only idempotent
        create + list) - needed for clarification #4 (listings expire on
        un-RSVP) to actually hold.
    scope_clarifications:

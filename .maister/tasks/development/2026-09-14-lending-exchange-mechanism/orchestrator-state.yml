task:
  title: "Lending / return / exchange mechanism gated on term registration"
  description: >
    Cały mechanizm oddania wypożyczenia, zamiany rzeczy.
    Gdy user zapisał się na zajęcia, ma możliwość wystawienia rzeczy do oddania,
    wypożyczenia, zamiany rzeczy. Gdy user zapisał się na zajęcia ma możliwość
    wypożyczyć, wziąć, oraz zamieniać się.
  status: in_progress
  tags: [circulation, terms, panel]
  priority: null


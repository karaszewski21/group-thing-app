      summary: >
        New TermItemListing entity in app.groups; TermAttendance withdrawal built
        from scratch (withdrawn_at); browse/take UI lives in Krąg/Term context
        (KragGrupyPage/useKragGrupy), not the Panel; expiry cutoff = exactly
        Term.occurs_on; no reservation-pipeline shortcuts, GIFT included.
    ui_mockups: {components_designed: [], summary: null}
    specification:
      summary: >
        spec.md complete: TermItemListing entity (app.groups, real FK to
        terms/parties, loose pointer to circulation's InventoryItem/Reservation
        mirroring Pledge.resolved_reservation_id). Verified /krag/:groupId is
        already reachable by any guardian with Circle Membership (not
        organizer-only) but is NOT TermAttendance-gated today — new UI section
        added inside KragGrupyPage.tsx with its own TermAttendance check via
        existing getMyAttendances(). New endpoints: browse/mine/take listings,
        withdraw-attendance. New _require_term_attendance primitive. Two new
        circulation_bridge pass-throughs (create_reservation, create_swap).
        ItemQuickAddForm reused via composition, not prop extension.
    architecture_decision: {decision: null, summary: null}
    implementation:

verification_context:
  last_status: passed_with_issues
  issues_found:
    - severity: high
      id: withdrawal-ui-not-wired
      description: >
        Spec's frontend section says the listing card disappears on TermAttendance
        withdrawal, but the plan never adds withdrawn_at to MyAttendanceResponse
        or filters it server-side in list_my_attendances_joined. Backend 403 still
        correctly blocks mutation; this is a UI-only gap. User chose to defer this
        fix to implementation planning rather than editing spec.md now.
    - severity: high
      id: testing-approach-factually-wrong
      description: >
        Spec's Testing Approach section incorrectly claims no pytest suite exists;
        src/backend/tests/ has 25 files including test_pledge_fulfillment.py (the
        closest existing analog) and test_authorization_matrix.py. Must be
        corrected during implementation planning/execution: real test gate is
        `uv run pytest` in src/backend, new tests should follow
        test_pledge_fulfillment.py's structure. User chose to defer this fix to
        implementation planning rather than editing spec.md now.
    - severity: medium
      id: bad-citations
      description: >
        Spec cites a non-existent "binding decision #13", a wrong numbering
        scheme for an authorization-matrix row ("row 76" = raw line number not
        comment-sequence number), and EditTermDialog.tsx as a wrong
        ItemQuickAddForm composition precedent (actual: PanelModals.tsx,
        guestSteps.tsx, organizerSteps.tsx). Underlying claims are correct;
        citations are wrong. Low implementation risk, cosmetic.
    - severity: medium
      id: cancelled-reservation-reopen-n1-gap
      description: >
        Derived-availability rule needs a per-listing circulation_bridge.get_reservation
        lookup to detect CANCELLED status and reopen the listing; the spec's N+1
        handling section doesn't explicitly call this out alongside the
        product_name/condition/lister-name lookups it does mention.
  fixes_applied: []
  decisions_made:
    - "User explicitly deferred fixing the 2 high-severity spec-audit findings to implementation planning rather than patching spec.md now"
  reverify_count: 0

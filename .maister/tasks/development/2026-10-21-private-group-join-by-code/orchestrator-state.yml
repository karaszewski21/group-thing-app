task:
  title: Dołączanie do grupy prywatnej przez kod (zastąpienie 'poproś o dostęp')
  description: Implement joining a PRIVATE group with a 6-digit organizer access code (plaintext groups.join_code, lazy get-or-create, regenerate, redeem with dual in-process limiter → 429), replacing and
    fully removing the GroupJoinRequest ("poproś o dostęp") mechanism, per research 2026-10-21-private-group-join-by-code.
  status: in_progress
  tags:

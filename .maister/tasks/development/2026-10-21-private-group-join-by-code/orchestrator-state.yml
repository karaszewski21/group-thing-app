  phase_summaries:
    research:
      summary: 'Modular-monolith design in the groups BC: 6-digit plaintext groups.join_code, lazy organizer GET + regenerate, redeem POST /api/groups/public/{id}/join-code behind dual in-process limiter
        (10/15min per user+group, 30/1h per group → 429), JoinByCodeSheet with ?code= one-shot auto-submit, JoinCodeCard on GroupDetailsPage + stepper done screen; migrations 0059 (add column) / 0060 (drop
        join requests). 8 ADRs.'
      key_findings:
      - Removal footprint ~13 backend modules, ~23 frontend files, 7 backend test files
      - add_active_membership, /access resolver and RSVP guard stay unchanged
      - Single uvicorn process makes an in-process limiter viable
      recommended_approach: See analysis/research-context/high-level-design.md and decision-log.md (ADR-001..008)
      decisions: []
      risks:
      - Brute-force residual risk ≈26 %/year per sustained attack on a group (accepted)
      - Accepted DoS on a group's 30-failure budget for up to 1 h
      - Limiter state lost on restart; must be revisited before >1 worker
      - Which term does "Kopiuj link z kodem" target on GroupDetailsPage — to settle in spec
      artifacts:
      - path: analysis/research-context/high-level-design.md
        label: High-level design (research)
        html: null
      - path: analysis/research-context/decision-log.md
        label: Decision log (research)
        html: null
      - path: analysis/research-context/research-report.md
        label: Research report
        html: null
    codebase_analysis:
      summary: Removal is broad (23 backend files, ~21 frontend files) but mechanical; the join-code feature reuses join-request helpers. Needs a 429 envelope with Retry-After, an in-process limiter with
        test reset, and a lazy write that survives Group's optimistic lock.
      key_files:
      - src/backend/app/groups/application/join_requests.py
      - src/backend/app/core/errors.py
      - src/backend/app/core/authorization_matrix.py
      - src/frontend/src/pages/krag/PrivateGroupGate.tsx
      - src/frontend/src/components/pending/PendingActionsHost.tsx
      - src/frontend/src/pages/panel/GroupDetailsPage.tsx
      primary_language: Python + TypeScript
      decisions: []
      risks:
      - Lazy GET can 409 under concurrency (updated_at optimistic lock)
      - add_active_membership has no uniqueness guard (double submit)
      - ApiError exposes no headers; 429 minutes must come in the server message
      artifacts:
      - path: analysis/codebase-analysis.md
        label: Codebase analysis
        html: null
      - path: analysis/clarifications.md
        label: Clarifications
        html: null
    clarifications:
    - decision: Kopiuj link z kodem on GroupDetailsPage targets nearest upcoming term via getTerms; fallback only Kopiuj kod
      rationale: user choice
    - decision: Lazy GET catches StaleDataError, rolls back, re-reads and returns the stored code
      rationale: user choice
    - decision: Drop all join-request data without migration
      rationale: no production data (confirmed)

task:
  title: "PRIVATE group term in TermPage: login + access request approved by organizer"
  description: |
    Handle PRIVATE groups in the same TermPage component/route. Visitor must be logged in and
    send an access request (via a request dialog opened by "Poproś o dostęp"; replaces
    JoinPrivateGroupDialog, no name/child fields); organizer receives and approves/rejects it;
    approved members see the full term view. Based on research
    .maister/tasks/research/2026-09-23-termpage-private-access-request (+ FSM research
    .maister/tasks/research/2026-09-23-termpage-state-machine).
  status: in_progress
  tags: [frontend, backend, private-group, access-request, term-page]
  priority: null
  supersedes: .maister/tasks/development/2026-09-22-private-group-join-requests


task:
  title: "Fix reservation locking, re-listing, cache refresh, and pickup confirmation for item exchange"
  description: >
    Four related bugs in the panel/krag item-listing and reservation flow (PL, as reported by user):

    1) Blokowanie kafla rzeczy w panelu gdy jest zarezerowany — gdy rzecz jest
       zarezerowana, nie powinno dać się zmienić jej oznaczeń
       wypożyczę/oddam/zamienię (kafel powinien być zablokowany do edycji
       tych flag podczas aktywnej rezerwacji).

    2) Po zaszłej transakcji (odebraniu/oddaniu/zamianie), user nie może
       ponownie wystawić rzeczy, którą wcześniej wziął/otrzymał w zamian —
       powinien móc ponownie wystawić uzyskaną (poprzednio otrzymaną) rzecz
       do ponownego obiegu. Konkretny błąd: PUT
       /api/item-listing-preferences/{id} nie ustawia poprawnie flag
       Wypożyczę/Oddam/Zamienię — wymaga weryfikacji i naprawy.

    3) Problem z cache/odświeżaniem — gdy dochodzi do wymiany/oddania
       rzeczy, lista "Moje rzeczy" w panelu się nie odświeża automatycznie
       (stare dane pozostają widoczne po zakończeniu transakcji).

    4) Brakująca dodatkowa akcja potwierdzenia wymiany/oddania — jeżeli user
       kliknie "pomiń" na dialogu potwierdzenia po zakończonym terminie, nie
       ma już żadnej innej akcji pozwalającej potwierdzić transakcję później.
       Należy dodać na zablokowanym (zarezerwowanym) kaflu rzeczy dodatkową
       akcję "odebrał/nieodebrał rzeczy", żeby transakcja (wymiana/oddanie
       rzeczy na magazynie) mogła jednak dojść do skutku po pominięciu
       dialogu.

    Context: A related but distinct task
    (.maister/tasks/development/2026-09-17-fix-giveaway-exchange, currently
    in_progress at phase-10) previously fixed root-cause defects in the
    giveaway/exchange confirm-transaction flow (wrong fulfill endpoint,
    missing GIFT/LEND reservation resolution). This task addresses further
    issues reported by the user after those fixes: UI locking during active
    reservations, re-listing previously-acquired items, cache invalidation,
    and a fallback confirmation action when the post-term dialog is
    skipped.
  status: completed
  tags: [bugfix, circulation, giveaway, exchange, panel, cache, ui]
  priority: high

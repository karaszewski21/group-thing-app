  phase_summaries:
    codebase_analysis:
      key_files:
        - src/backend/app/groups/application/term_item_listings.py
        - src/frontend/src/pages/panel/views/RzeczyView.tsx
        - src/frontend/src/pages/panel/PanelDataContext.tsx
        - src/frontend/src/api/inventories.ts
        - src/frontend/src/pages/krag/KragGrupyPage.tsx
        - src/backend/app/groups/application/term_end_scan.py
        - src/backend/app/groups/models.py
      primary_language: "Python/FastAPI + React/TypeScript"
      summary: >
        All four bugs root-caused. #1 (tile locking): RzeczyView.tsx already
        fetches itemBalances and has ACTIVE_LOCK_BALANCE_STATUSES defined but
        never applies `disabled` to the mode-toggle buttons — pure UI fix.
        #2 (re-list after transaction): set_item_listing_preference in
        term_item_listings.py reuses an existing ItemListingPreference row on
        `mode` update but never reassigns `owner_party_id`, so a newly
        acquired item's preference row stays attributed to the previous
        owner — one-line backend fix. #3 (cache refresh): confirmPendingAction
        in PanelDataContext.tsx is the only mutation handler in that file
        that omits `await load({ silent: true })` after its mutation — every
        sibling handler follows that pattern. #4 (skip fallback): backend
        confirm_transaction endpoint is already generic/re-callable, but no
        entity (Reservation/ItemListingPreference) persists a term_id — the
        only term_id source is the notification's link_path, which
        "Później" (skip) marks read and thus discards. Needs a scope
        decision: frontend-only re-resolution from read notifications vs. a
        backend migration to persist term_id. Zero test coverage exists for
        bugs #2, #3, #4; bug #1 has only badge-level (non-e2e) coverage.
    clarifications: []
    gap_analysis:
      integration_points:
        - "circulation/application/reservations.py::create_reservation/create_lend_reservation -> new term_id param, threaded from groups/term_item_listings.py::take_item_listing and propose_swap"
        - "groups/application/term_item_listings.py::confirm_transaction -> shared gating helper (proposed) -> circulation_bridge.confirm_reservation/fulfill_reservation"
        - "groups/application/term_item_listings.py::NEW cancel_transaction -> same shared gating helper -> circulation_bridge.cancel_reservation (x2 for SWAP paired leg)"
        - "groups/router/term_item_listings.py -> NEW POST /api/reservations/{id}/cancel-transaction route"
        - "frontend api/inventories.ts::getInventoryItemBalance(s) -> needs new reservation_id field for tile buttons"
        - "frontend RzeczyView.tsx tile -> ACTIVE_LOCK_BALANCE_STATUSES (disable toggles) + new Odebrał/Anuluj buttons"
        - "PanelDataContext.tsx::confirmPendingAction -> add await load({ silent: true })"
        - "groups/application/term_item_listings.py::set_item_listing_preference update branch -> existing.owner_party_id reassignment"
      summary: >
        Risk elevated to medium: bug #4 requires a new cancel_transaction
        use case (no existing primitive handles SWAP-pairing or the
        confirm-style race check), a new Reservation.term_id column
        threaded through 3 creation call sites across the groups/circulation
        boundary, and a previously-unflagged gap — RzeczyView's tile has no
        reservation_id at all, so the balances endpoint must be extended.
        Bugs #1-#3 remain low-risk, no-schema-change fixes. 4 critical + 2
        important decisions raised for user review.
    scope_clarifications: {scope_expanded: null, summary: null}
    ui_mockups:

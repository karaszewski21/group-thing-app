      summary: Chosen 1A GIS popup + nonce cookie, 2A JSON token handoff, 3A 409 on email collision, 4C always GUEST, 5B lean MVP; 9 ADRs; migrations 0107 user_identities + 0108 nullable password_hash.
      key_findings:
      - Flow ends in existing encode_login_token / applyToken; session, proxy, AuthGuard, OAuth2 server unchanged.
      - Local RS256 verification with pyjwt[crypto] against Google JWKS; nonce bound via signed HttpOnly cookie.
      - Never auto-link by email (no email verification, no JWT revocation).
      - Permissions read from DB so admins keep ADMIN.
      recommended_approach: Thin identity-provider adapter in app/auth with shared bootstrap_person_account in users context.
      decisions: []

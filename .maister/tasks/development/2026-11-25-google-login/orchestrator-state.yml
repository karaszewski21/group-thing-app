      summary: No Google-login code yet (69f36ee was research only). Extend app/auth router, extract bootstrap_person_account from app/users/service.py::register; blockers are the missing cryptography (pyjwt[crypto]) and the NOT NULL password_hash that crashes login on None. Frontend integration is the SocialAuthButtons mock in AuthTabs (/login + 6 AuthSheet surfaces). Alembic head 0106.

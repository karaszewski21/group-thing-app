task:
  title: Logowanie i rejestracja przez Google
  description: >-
    Implement Google sign-in and sign-up in aj (FastAPI + Next.js) per the completed research
    .maister/tasks/research/2026-11-25-google-login: GIS popup button + ID token + server nonce cookie,
    POST /api/auth/google returning {token, created, party_id}, user_identities table (0107), nullable

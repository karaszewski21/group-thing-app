    specification:
      summary: 18 requirements (R1-R11 backend/config, R12-R16 frontend, R17 deploy, R18 docs); settles config names, aj_google_nonce cookie signed with a purpose key, GoogleTokenVerifier dependency with async httpx JWKS cache, re-read race handling, error table, module layout, matrix rows 72/73, 9 test groups.
      decisions:
      - decision: Config names GOOGLE_CLIENT_ID, AUTH_COOKIE_SECURE (default true), NEXT_PUBLIC_GOOGLE_CLIENT_ID
        rationale: settles clarification 1; Secure never from headers
      - decision: Nonce cookie aj_google_nonce as HS256 JWT signed with HMAC-SHA256(JWT_SECRET, purpose label), cleared on every POST response
        rationale: reuses PyJWT, a login token can never pass as a nonce cookie
      - decision: GoogleTokenVerifier behind get_google_verifier dependency; async httpx JWKS, 1 h cache, forced refresh at most every 60 s
        rationale: testable with a fake JWKS, no blocking urllib
      - decision: Races handled by savepoint + re-read, not by constraint name
        rationale: identity race logs in, email race gives 409
      - decision: Nonce GET imperative, not a TanStack query
        rationale: each call rotates a cookie and must not be cached or refetched (justified exception)
      risks:
      - Popup blocking in in-app browsers is unmeasured (D6 deferred).
      - GIS iframe in the focus-trapped AuthSheet at 375 px needs a manual check.
      - No image-only rollback past 0108 (runbook required).
      - Safari over http needs AUTH_COOKIE_SECURE=false.
      - 'Assumptions made by the spec: cookie name, 60 s throttle, 1 h JWKS TTL, 5 s timeout, 4096-char credential cap, matrix rows 72/73, nonce refresh at 9 min.'
      artifacts:
      - path: analysis/requirements.md

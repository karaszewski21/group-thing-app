  description: >
    Task A2 from research 2026-10-07-organizer-page-layouts-theming, building on A1 (uncommitted in working tree).
    Migration 0052: organizations.page_layout VARCHAR(64) NOT NULL DEFAULT 'CLASSIC' + palette_preset VARCHAR(40) NULL,
    code allowlists (page_layouts.py with resolve_page_layout as single place, palettes.py), no DB enum/CHECK;
    PATCH /api/organizations/{id} with model_fields_set (explicit null clears colors/preset; name/page_layout null -> 422;

    Frontend: 8-12 hand-tuned palette presets + "Własny" (custom primary, optional accent) with contrast correction shown;
    declarative layout registry (PageLayoutDefinition without Component/minData/tier) + LayoutRenderer + blocks for
    CLASSIC and LINKS (data available today: name, colors; ghost blocks for owner); EditorSheet inline on /:slug?edit=1
    (bottom sheet tabs Układ/Kolory, static SVG thumbnails + Polecany badge, mini previews of term/product, draft in
    React state, explicit Zapisz/Anuluj, "Przywróć domyślne"); entries from AccountMenu "Moja organizacja" and HomeView;
    TanStack hooks (useMyOrganization, useUpdateOrganization). FE/BE key parity tests.
  status: completed
  tags: [frontend, backend, migration, editor, theming]

task:
  title: "Product page reservations, item visibility, physical & suggested location, reserved badges"
  description: >
    Review, refactor and plan. (1) Take/swap reservation moves entirely to the product page;
    tiles of attendees' items on term/event pages and org/user item lists show only the owner's
    intent ("Chcę oddać" / "Chcę się zamienić") and link to the product page; take/swap buttons are
    removed from lists/tiles. (2) Item proposal visibility: public by default, owner can set private
    (mainly for private groups). (3) "Moje rzeczy" gets the item's physical location (future global
    search, product page shows where the item physically is, pickup independent of a term).
    (4) Product page shows selects of terms/events the owner attends — the "suggested" location.
    (5) Reserved items stay on lists with a "zarezerwowana" badge; logged-in users see who reserved,
    anonymous users only "zarezerwowana".
  status: completed
  tags: [circulation, groups, events, frontend, product-page]
  priority: null


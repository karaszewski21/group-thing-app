task:
  title: Cykl życia wypożyczenia (LEND) — co po przekazaniu rzeczy
  description: >
    Research przed dodaniem funkcji wypożyczenia. Przy relacji wypożyczenia tworzy się
    wirtualny magazyn. Brak zaplanowanych kroków po wypożyczeniu: chęć zwrotu, żądanie
    zwrotu, oddanie itp.
  status: completed
  tags: [lend, circulation, virtual-inventory, return]

research_context:
  research_type: mixed
  research_question: >
    Jak zaprojektować funkcję wypożyczenia (LEND) obejmującą pełny cykl życia po przekazaniu
    rzeczy — wirtualny magazyn pożyczającego, chęć/żądanie zwrotu, przedłużenie, termin
    zwrotu, potwierdzenie odbioru, zaległości i spory?
  scope:
    included:
      - model stanów wypożyczenia od oferty do zamknięcia
      - zdarzenia po wypożyczeniu (chęć zwrotu, żądanie zwrotu, przedłużenie, due date, zaległość, potwierdzenie zwrotu, spór)
      - miejsce/czas fizycznego zwrotu (Termin vs poza Terminem)
      - VIRTUAL inventory, home_inventory_id, InventoryBalance, ledger
      - powiadomienia i UI
      - relacja z Pledge->LEND do organizatora
    excluded:
      - implementacja
      - płatności/kaucje/ubezpieczenia
      - zmiany GIFT/SWAP
    constraints:
      - DDD boundary groups<->circulation via circulation_bridge
      - standards in .maister/docs/standards
      - pre-production, schema changes allowed
  methodology: []
  sources: []
  confidence_level: medium  # high for current state/bugs, medium for proposed model
  gathering_strategy:
    categories: [codebase-backend, codebase-frontend-ux, docs-decisions, external]
    count: 4
    source: planner
  project_doc_paths:
    - .maister/docs/project/tech-stack.md
    - .maister/docs/project/architecture.md
  phase_summaries:
    phase-1:
      summary: >
        Only first half of LEND works (take -> confirm after Term -> VIRTUAL, LENT, +1pt owner).
        Return is borrower-only one-click; owner can't see lent items. Pre-feature bugs B2,B3,B6,B7,B10,B11,B12.
        Recommendation: keep VIRTUAL + new Loan entity (ACTIVE/RETURN_PENDING/RETURNED/DISPUTED/LOST),
        two-sided return closed by owner, derived overdue, reminders via scan like term_end_scan. 18 open decisions D1-D18.
      steps_completed: [initialize, plan, gather, synthesize]
    phase-3:
      summary: "solution-exploration.md: 7 decision areas O1-O7, 26 alternatives, 10 deferred ideas"
    phase-4:
      summary: "User converged on all 7 areas; O5 modified by user (disputes fully outside system, no LOST)."
      decision_areas:
        - {area: "O1 loan state carrier & item location", alternatives_count: 4, chosen_approach: "1A VIRTUAL + new loans table (Loan created at hand-over confirm; remove BalanceStatus.RETURNED; ADR vs INV; fix B10)"}
        - {area: "O2 return closing protocol", alternatives_count: 4, chosen_approach: "2A borrower declares return (optional future Term), owner confirms 'Odebrałem' anytime (also without declaration); +1pt borrower on owner confirm; no auto-close"}
        - {area: "O3 due date / extension / recall", alternatives_count: 4, chosen_approach: "3A due_date = hand-over Term date + 14d, shown at 'Pożycz'; extension = borrower request -> owner accept/reject (or owner extends), no limit; recall shortens due_date + notification"}
        - {area: "O4 reminders & overdue", alternatives_count: 4, chosen_approach: "4A separate loan_due_scan (-2d, due day, every 7d), marker per (loan_id, kind, due_date), overdue derived, no sanctions"}
        - {area: "O5 disputes & loss", alternatives_count: 4, chosen_approach: "USER CUSTOM: fully outside system. Only owner 'Odebrałem' closes a loan; if item never returns loan stays open until users settle offline. No DISPUTED/LOST states. Note: consider capping overdue reminders."}
        - {area: "O6 cancellation & Pledge->LEND", alternatives_count: 3, chosen_approach: "6A both parties can cancel PENDING LEND before hand-over (also before Term); Pledge-LEND = regular Loan (due = class day), pledger chooses GIFT vs LEND; fulfil via groups not raw /fulfill"}
        - {area: "O7 MVP scope & sequencing", alternatives_count: 4, chosen_approach: "7A step 0 fixes B6,B7,B10,B12 + tests separately; then MVP with loans (2A,3A,4A,6A) incl. B2,B3,B11"}
      deferred_ideas: ["auto-close after N days (2B)", "per-item loan_days (3C)", "Term-anchored reminders (4D)", "disputes/lost (5A/5B)", "organizer arbiter (5C)", "sanctions for overdue"]
    phase-5:
      design_preferences:
        - "Loan entity + transitions in app.circulation (no Term knowledge); endpoints and Term/Circle rules in app.groups via circulation_bridge (like confirm_transaction)"
        - "Return ALWAYS outside Terms (privately): no return Term choice, no post-Term return prompt, no Term gate on return. Hand-over (lend start) stays at Term as today."
        - "Keep due_date (hand-over Term date + 14d) + extension + recall; overdue reminders capped at 3 (due day + 2 more every 7d), then only 'po terminie' badge"
      summary: "high-level-design.md + decision-log.md (10 MADR ADRs); VIRTUAL lifecycle clarified: one persistent VIRTUAL per user, item PERSONAL->VIRTUAL->PERSONAL"
      architecture_style: "modular monolith with DDD boundaries (Loan in circulation, actions/scans in groups via circulation_bridge)"
      decisions_count: 10


task:
  title: "Krok 0 wypożyczeń — poprawki B6, B7, B10, B12"
  description: >
    Krok 0 z research 2026-09-25-lend-lifecycle-virtual-inventory (ADR-008, ADR-010):
    B6 — surowe /api/reservations* (POST, confirm, cancel, fulfill) biorą reserved_by z body i omijają
    reguły groups: aktor = principal + reguły per typ (trasy zostają, usunięcie w MVP);
    B7 — confirm_transaction/cancel_transaction ufają term_id z body: Termin z rezerwacji;
    B10 — właściciel nie widzi pożyczonej rzeczy w GET /api/inventory-items/mine (po home_inventory_id, pole „pożyczone: komu, do kiedy”);
    B12 — term_end_scan ignoruje PENDING LEND i Pledge-LEND: TERM_CONFIRMATION_NEEDED dla LEND.
    Każda poprawka z testami regresji. Poza zakresem: B2, B3, B11, encja Loan (MVP).
  status: in_progress
  tags: [lend, security, bugfix, circulation, groups]
  priority: high


      summary: All 8 decisions resolved with recommended options; EMAIL_NOTIFICATIONS_ENABLED second flag; registration mail atomic inside users.service.register; own email_messages queue is the outbox.
      decisions:
      - decision: C-1 issue verification inside users.service.register
        rationale: atomic, no import cycle
      - decision: C-2 EMAIL_NOTIFICATIONS_ENABLED default false
        rationale: warm-up + D14 gate without code change
      - decision: I-1 expire stale queue rows (24h / token expiry)

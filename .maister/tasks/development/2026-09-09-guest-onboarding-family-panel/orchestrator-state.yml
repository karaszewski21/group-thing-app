task:
  title: Guest onboarding simplification & family creation moved to panel
  description: |
    1. Fix guest onboarding — do not ask guests about family and members;
       keep only the "add things/items" step.
    2. Move family creation into the panel (like the current hamburger menu
       entry). If a logged-in user has no family, the panel shows a 404-style
       state with a dialog: step 1 (family name) and step 2 (members) taken
       from the current onboarding. Do not force family creation up front at
       account creation time.
    3. Bug: an already-logged-in user cannot sign up for classes — temporary
       accounts are being created instead of using the existing session.
    4. For a guest (no account) who wants to sign up for classes — suggest
       creating an account but do not force it.
  status: completed
  tags: [onboarding, guest, family, panel, auth]
  priority: high


      primary_language: "TypeScript/React (frontend), Python/FastAPI (backend)"
      summary: >
        Guest onboarding = 3 skippable steps (family-name draft never persisted,
        family-members -> POST /api/families/mine/members, items). Panel has no explicit
        create-family action; family auto-bootstraps on first member add and discards the
        typed name (auto-names "Rodzina <display_name>"). RSVP bug root cause CONFIRMED:
        POST /api/groups/public/{id}/rsvp has NO auth dependency and create_rsvp hardcodes
        account_user_id=None; public page never calls useAuth(); Bearer header sent but
        ignored. AccountMergeForm already exists for guest->account upgrade post-RSVP.
    clarifications: []
    gap_analysis:
      integration_points:
        - "app/groups/router.py create_rsvp gains Depends(get_current_principal) -> Principal|None (existing never-raising dep)"
        - "app/groups/service.py create_rsvp(..., principal=None); attach TermAttendance to profile.party_id when logged in"
        - "app/families/schemas.py + service.py: optional family_name plumbed into existing bootstrap_family_for_party"
        - "guestSteps.tsx reduced to [items]; NEW CreateFamilyDialog.tsx mirrors FirstTermStepperGuest"
        - "PanelPage.tsx no-family branch in 'rodzina' view + new ModalKind"
        - "KragGrupyPage PublicKragGrupyView reads useAuth(); RsvpDialog logged-in variant"
      summary: >
        All 4 threads well-scoped. RSVP fix smaller than expected: get_current_principal
        already returns Principal|None and never raises — no new soft-auth dep needed.
        bootstrap_family_for_party already accepts a name (Q3 ~3 lines). No Alembic migration.
        Main user-journey gap: logged-in attendee has no in-app view of classes they signed up for.
    scope_clarifications:
      scope_expanded: true
      summary: >
        D1: new dedicated POST /api/families/mine endpoint (idempotent, named). D2: family always
        has >=1 member — creator auto-added as first GUARDIAN/primary; step 2 optional. D3: hide
        wizard chrome when single step. D4/D5/D6/D7 all accepted as expansions: family rename
        (PATCH /api/families/{id}), server-derived RSVP attached_to_account state, "Zapisane zajęcia"
        panel view (GET /api/groups/mine/attendances), account suggestion in PublicKragGrupyView
        confirmation block.
    ui_mockups: {components_designed: [], summary: null}
    specification:
      summary: >
        spec.md: 10 requirements (R1-R10). 3 new endpoints (POST /api/families/mine idempotent,
        PATCH /api/families/{id} guardian-only rename, GET /api/groups/mine/attendances) + 1 changed
        (POST rsvp gains optional Depends(get_current_principal)). No DB schema change, no migration.
        Reuse-heavy: CreateFamilyDialog mirrors FirstTermStepperGuest; bootstrap_family_for_party +

    specification:
      summary: 'Spec: 37 FRs (DB 7, BE 7, MT 9, MR 4, FE 7, OPS 3) and 10 acceptance criteria; matcher raw SQL over amended-0099 contract, MATCH/SUGGESTION rules, bells_due handler, /suggestions, frontend
        states bound to 5 mockups.'
      decisions:
      - decision: 'short_words_query replaced: words <=4 chars become exact weight-A lexemes in stem_query, no typo path'
        rationale: Prevents lego matching Legowisko
      - decision: Startup gate checks revision >=99 AND matchable_listings exists
        rationale: Amended 0099 keeps the same revision id
      - decision: Window loop every 60 s with 2-min overlap; also stores suggestions
        rationale: Low latency, harmless repeats
      - decision: Suggestions fetched inside useWantMatches query
        rationale: No new hook
      - decision: Forward statement timeout 30 s, want stays flagged and is retried
        rationale: No 503 path anymore
      risks:
      - Stem false positives
      - Privacy parity of can_see_listing
      - Cost of inlining the view
      - Stale window pair
      - Tokenizer vs ts-parser differences
      - Starting suffix list is an assumption tuned by release gate
      artifacts:
      - path: implementation/spec.md
        label: Specification
        html: implementation/spec.html
      - path: analysis/requirements.md
        label: Requirements
        html: null
    spec_audit:
      summary: Audit fail (1C/5H/6M/9L); all 21 findings resolved in spec revision 2 (41 FRs). Stop-words skipped (user). Added e/a-ending exception to 4-char exact rule (zime -> zim:*).
      decisions:
      - decision: Skip 24 Polish stop-words in words_pl
        rationale: User decision (M3)
      - decision: can_see_listing replaced by inlinable views group_holdings/private_group_peers
        rationale: H1 inlining
      - decision: Downgrade uses IF EXISTS + old-0099-shape test
        rationale: C1
      - decision: update_want locks the want row before deleting matches
        rationale: H3
      - decision: In-memory per-process backoff for failing wants
        rationale: H4
      - decision: Short words ending in e/a with >=3 chars before are stemmed
        rationale: kurtka na zime -> Kurtka zimowa must MATCH
      risks:
      - 'resolved: C1 amended 0099 downgrade from new image fails on old-0099 DBs (needs IF EXISTS or old-image downgrade)'
      - 'resolved: H1 can_see_listing with subquery cannot inline'
      - 'resolved: H2 PRIVATE rule/parity cases incomplete; bells leak product names'
      - 'resolved: H3 edit during matcher run leaves stale pairs (DELETE before row lock)'
      - 'resolved: H4 failing want blocks queue'
      - 'resolved: H5 unqualified function calls break pg_dump restore of generated columns'
      - 'resolved: M3 stopwords na/dla count as want words'
      - Short-word e/a exception refines the user 4-char rule; release gate scores it
      artifacts:
      - path: verification/spec-audit.md
        label: Spec audit
        html: null
      - path: implementation/spec.md
        label: Specification rev 2
        html: implementation/spec.html
    planning:
      summary: 11 task groups, 83 steps; critical path 1-2-3-6-9-10-11; matcher track 4-5 parallel to backend 2-3; frontend 7-8 after 2. Full visual coverage 7/7.
      decisions:
      - decision: Backend deletions held until Group 3
        rationale: Keep backend importable after Group 2
      - decision: Local DB downgrade/upgrade (10.5) gated on explicit user approval
        rationale: Deletes all wants data

  phase_summaries:
    codebase_analysis:
      summary: Wants matching is one in-process SQL statement (app/wants/application/matcher.py) built from ORM models of six modules, run synchronously on create/update/resume and every 15 min via APScheduler;
        none of the target DB contract exists yet.
      key_files:
      - src/backend/app/wants/application/matcher.py
      - src/backend/app/wants/application/scan.py
      - src/backend/app/wants/application/match_notifications.py
      - src/backend/app/wants/application/writes.py
      - src/backend/app/main.py
      - src/backend/app/wants/models.py
      - src/backend/app/wants/application/reads.py
      - docker-compose.yml
      - src/frontend/src/features/wanted/WantMatchesView.tsx
      - src/frontend/src/hooks/useWantMatches.ts
      primary_language: python
      decisions:
      - decision: Matcher uses raw SQL against a DB contract, not app.* imports
        rationale: Importing app requires JWT_SECRET/DATABASE_URL and builds an engine at import
      - decision: Visibility rule stays defined once (SQL function used by backend or parity test)
        rationale: owner_shares_group_with is guarded by test_membership_definition_guard.py
      - decision: Backend outbox handler writes bell rows
        rationale: Slugs, message templates and 500-char cap live in Python
      risks:
      - Outbox dispatcher marks unhandled event types PROCESSED; pollers must split by event_types
      - SUGGESTION tier per-lexeme counting is not served by GIN indexes; must be measured
      - 0099 release gate (>=200 labelled pairs) must be re-run for new rules
      artifacts:
      - path: analysis/codebase-analysis.md
        label: Codebase analysis
        html: null
    clarifications:
      summary: Same DB and same login aj; MATCH bell via outbox (<=60 s OK); MATCH uses name only; late-takeable items stay a known limit.
      decisions:
      - decision: Same database, same login aj
        rationale: User wants to focus on tables only
      - decision: Bell via outbox, <=60 s latency accepted
        rationale: Keeps message/slug rules in backend
      - decision: MATCH counts name words only
        rationale: Description words add noise
      - decision: Late-takeable items out of scope
        rationale: Known limit kept
      risks: []
      artifacts:
      - path: analysis/clarifications.md
        label: Clarifications
        html: null
    gap_analysis:
      summary: 'None of the target pieces exist (tier, pending marker, view, SQL function, NOTIFY, stemming, matcher app, compose service, outbox handler). Typo check must be per word: whole-name 0.714
        makes Traktor Bruder Claas a MATCH.'
      integration_points:
      - src/backend/alembic/versions/0099_wants.py
      - src/backend/app/wants/application/writes.py
      - src/backend/app/main.py
      - src/backend/app/notifications/outbox_listener.py
      - src/backend/app/wants/application/reads.py
      - docker-compose.yml
      - src/frontend/src/features/wanted/WantMatchesView.tsx
      - src/frontend/src/hooks/useWantMatches.ts
      decisions: []
      risks:
      - Whole-name trigram contradicts expected SUGGESTION example (0.714)
      - Stem prefixes give false positives (Kurtyna, Legowisko); release gate must score final rules
      - SQL visibility copy needs parity test or PRIVATE listings leak
      - dispatch_pending commits even when a handler raises; wants handler must run in begin_nested()
      - Backend has no healthcheck; matcher could start before migrations
      artifacts:
      - path: analysis/gap-analysis.md
        label: Gap analysis
        html: null
    scope_clarifications:
      scope_expanded: false
      summary: All 15 decisions resolved; recommendations accepted except contract changes go into an amended 0099 instead of new 0100.
      decisions:
      - decision: Typo path per word, one threshold 0.65
        rationale: Whole-name scoring misclassifies the Traktor example
      - decision: Pending/queue via wants.match_requested_at + trigger NOTIFY
        rationale: Durable queue and real pending signal for frontend
      - decision: Forward matching in matcher; want-triggered matches born seen, no bell
        rationale: Same behaviour as today
      - decision: can_see_listing SQL function + backend parity test
        rationale: Visibility stays effectively single-definition
      - decision: 'Stemming in DB: stem_pl + generated stem_query/stem_words'
        rationale: Rule lives with schema owner
      - decision: Suggestions stored by matcher, wants with >=3 words, cap 10, no bell
        rationale: Stable cap, cheap reads
      - decision: Separate GET /wants/{id}/suggestions; counts MATCH only
        rationale: Existing consumers unchanged
      - decision: Frontend polls every 2 s up to ~60 s
        rationale: Fast feedback, bounded polling
      - decision: Expire/remind/purge in matcher; one wants.bells_due outbox event
        rationale: Whole background lifecycle in one process; summed counts kept
      - decision: Matcher waits for alembic_version at startup
        rationale: No backend changes needed
      - decision: SKIP LOCKED + advisory lock against duplicates
        rationale: Second copy skips busy work
      - decision: Matcher tests run backend alembic migrations
        rationale: Always current schema
      - decision: Amend 0099 instead of new 0100
        rationale: User choice; 0099 not yet released
      risks:
      - Amending 0099 requires downgrade 0098 + upgrade head on existing DBs, deleting all wants data and WANT_* notifications
      artifacts:
      - path: analysis/scope-clarifications.md
        label: Scope clarifications
        html: null

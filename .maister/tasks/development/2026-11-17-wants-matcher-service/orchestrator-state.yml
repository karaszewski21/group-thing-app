task:
  title: Wydzielenie matchera Szukam do src/matcher + dwa poziomy dopasowań
  description: 'Wydzielenie dopasowywania „Szukam” (wants) do osobnej aplikacji Python src/matcher (osobny kontener docker-compose) z kontraktem przez bazę (widok matchable_listings, funkcja can_see_listing,
    NOTIFY wants_changed, want_matches.tier, outbox → powiadomienia w backendzie, osobny użytkownik bazy matcher) oraz dwa poziomy dopasowań: MATCH (wszystkie słowa po rdzeniu, prefiksowe tsquery + trigram
    ~0.65) i SUGGESTION („Może Cię zainteresuje”, brakuje ≤1 słowa przy ≥2 wspólnych, bez dzwonka, ≤10). Front: stan „Szukamy…” i sekcja podpowiedzi z „brakuje: …”. Compose, runbook, architecture.md. Warunek
    wydania 0099 obowiązuje.'
  status: in_progress
  tags:
  - wants
  - matcher
  - search
  - docker
  priority: high

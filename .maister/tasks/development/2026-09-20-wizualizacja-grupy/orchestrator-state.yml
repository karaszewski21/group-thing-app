task:
  title: "Wizualizacja grupy zajęciowej (koło / boisko / stół)"
  description: >
    Rozbudowa istniejącego ekranu /krag/:groupId o 3 tryby layoutu wizualizacji
    uczestników grupy (koło/mandala — istnieje, boisko piłkarskie — nowy, stół —
    nowy), organizator-wybierany i zapisywany per grupa (Group.layout_mode),
    ikony "udostępnia rzecz"/"przynosi na zajęcia" na avatarach (nowa agregacja
    backendowa), oraz rozbudowana karta rodziny z sekcją "do wymiany w grupie"
    (lista aktywnych ofert + przycisk Biorę, bez przycisku Napisz). Pełna
    specyfikacja i zatwierdzone mockupy pochodzą z zakończonego zadania
    product-design .maister/tasks/product-design/2026-09-20-wizualizacja-grupy/.
  status: completed
  tags: [ui, groups, circulation, frontend, backend]
  priority: null


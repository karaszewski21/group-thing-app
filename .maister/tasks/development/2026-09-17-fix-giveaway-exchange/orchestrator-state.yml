task:
  title: "Fix broken giveaway (oddanie) and exchange (zamiana) mechanism"
  description: >
    Cały czas nie działa mechanizm oddania i zamiany. Mechanizm ma działać wg
    poniższych kroków (PL, jak podane przez użytkownika):

    Wszystkie rzeczy oznaczone Oddam/Wypożyczę/Zamienię są pokazywane na
    stronie terminu. Tylko osoby zapisane na termin mogą brać udział.

    ODDANIE — tylko rzeczy oznaczone "oddam" mogą być oddane:
    1) Organizator (lub osoba z uprawnieniem do dodawania terminów) dodaje
       termin.
    2) Na stronie terminu widoczna jest lista rzeczy oferowanych, w różnych
       stanach.
    3) Zalogowany user może wziąć rzecz; niezalogowany musi się zalogować i
       zapisać na zajęcia.
    4) Po rezerwacji rzeczy: notyfikacja + zablokowanie rzeczy u dawcy.
    5) Po zajęciach: dialog u dawcy i odbiorcy — "Czy dałeś rzecz X?" /
       "Czy otrzymałeś rzecz X?".
    6) Po akceptacji przez którąkolwiek stronę (kto pierwszy) — produkt
       zostaje przepisany do inventory_items odbiorcy + tworzy się
       circulation_entries / circulation_transactions (księgowanie
       transakcji, potrzebne do audytu historii przekazywania rzeczy).

    ZAMIANA — tylko rzeczy oznaczone "zamienię" mogą być zamienione:
    1) Organizator dodaje termin.
    2) Na stronie terminu lista rzeczy oferowanych w różnych stanach.
    3) Zalogowany user może zamienić się na rzecz, ale TYLKO oferując rzecz
       oznaczoną "zamienię" ze swojej listy; niezalogowany musi się
       zalogować i zapisać na zajęcia.
    4) Po rezerwacji: notyfikacja + zablokowanie rzeczy u dawcy; obie strony
       stają się jakby jednocześnie dawcami/odbiorcami.
    5) Po zajęciach: dialog u obu stron — "Czy dałeś rzecz X?".
    6) Po akceptacji przez którąkolwiek stronę (kto pierwszy) — 2 produkty
       zostają zamienione między inventory_items obu stron + tworzy się
       circulation_entries / circulation_transactions (księgowanie,
       potrzebne do audytu historii).

    Uncommitted working-tree state (per git status) already touches this
    exact area (term_end_scan.py, term_item_listings.py, main.py,
    SpotkaniaView.tsx, test_term_item_listings.py, PanelPage.test.tsx),
    likely leftover/WIP from prior task
    .maister/tasks/development/2026-09-16-item-giveaway-exchange-rework
    which was marked "completed" in its own state file. User reports the
    mechanism still does not work — this task must determine WHY (root
    cause) and fix it, not just re-describe desired behavior.
  status: in_progress
  tags: [bugfix, circulation, giveaway, exchange]
  priority: high

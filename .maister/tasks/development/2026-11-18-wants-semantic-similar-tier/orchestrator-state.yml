      key_findings:
      - 'Hard-negative AUC 0.50-0.73 for all small models: embeddings show related items, never ring a bell'
      - 768-d vector is TOASTed (50x slower), halfvec avoids it; HNSW drops filtered rows, exact scan is fast at this scale
      - 'No separate worker: embedder and outbox poller run in the API process; vector timing decides correctness'
      recommended_approach: High-level design in analysis/research-context/high-level-design.md with ADR-001..009 in decision-log.md
      decisions_made: []
      decisions: []

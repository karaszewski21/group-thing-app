task:
  title: "Wydzielenie modułu app/pages (publiczne strony właściciela) z app/groups"
  description: >-
    Krok 1 refaktoru granic modułów backendu: wydzielić nowy moduł tylko do odczytu
    `app/pages` i przenieść do niego publiczne strony właściciela z `app/groups` —
    `groups/router/organizer_page.py`, `groups/application/organizer_page.py` i
    `groups/application/owner_items.py` (wraz z ich schematami odpowiedzi i potrzebnymi
    zapytaniami). Moduł `pages` zależy od groups/events/organizations/users/circulation
    wyłącznie przez ACL-e w `pages/infrastructure/`, nic nie zależy od `pages`. URL-e,
    kształty odpowiedzi, nagłówki cache i schemat bazy bez zmian; bez migracji. Poza
    zakresem: przeniesienie `derive_party_slug`, wydzielenie modułu `exchange` z groups,
    rename `circulation` → `inventory`, ujednolicenie prefiksów organizers/organizations.
  status: completed
  tags: [backend, refactor, module-boundaries]
  priority: null

project_context:
  project_doc_paths:
    - .maister/docs/project/tech-stack.md
    - .maister/docs/project/architecture.md


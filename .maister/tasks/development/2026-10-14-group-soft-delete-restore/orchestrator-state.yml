  title: Group soft delete with admin restore
  description: >
    Miękkie usuwanie grupy (Circle) z przywracaniem przez admina. Obecny kosz "Usuń grupę"
    (SpotkaniaView.tsx ~181, handleRemoveGroup PanelDataContext.tsx:609) bez potwierdzenia kończy
    tylko Leadership (POST /api/leaderships/{id}/end), grupa zostaje osierocona. Cel: Group.deleted_at
    (+deleted_by_party_id?) + migracja; DELETE /api/groups/{id} (aktywny organizator, nie kończy Leadership);
    usunięta grupa = nieistniejąca (public view, /access 404, my groups, organizer directory, my attendances,
    blokada RSVP/terminów) przez centralny filtr; admin AdminGroupsPage pokazuje usunięte + "Przywróć"
    (POST /api/groups/{id}/restore, ADMIN); ConfirmDialog w panelu. Otwarte: nadchodzące terminy z zapisami.
    Retencja: brak. Poza zakresem: przekazanie/sprzedaż grupy.
  status: in_progress
  tags: [groups, soft-delete, admin]
  priority: medium

task:
  title: "Simplified group creation for any user + Location entity (Google Places) on group and term"
  description: |
    A. Any logged-in user creates a group in a 2-step stepper (group name + optional default location/capacity -> first term),
       no organization step, no "organizer" wording; organization/slug becomes an optional follow-up.
       Default visibility PRIVATE without organization, PUBLIC with. Links fall back to /krag/... when organizer_slug is null.
       Panel shows both "groups I lead" and "groups I attend"; home hints updated.
    B. New Location entity (owner_party_id, name, formatted_address, google_place_id, lat, lng, notes, source GOOGLE|MANUAL, soft delete),
       endpoints /api/locations (mine, POST, PATCH, DELETE), Group.default_location_id/default_capacity, Term.location_id/capacity
       (copied from group defaults at term creation), public LocationResponse without owner, shared LocationPicker with
       Google Places Autocomplete (VITE_GOOGLE_MAPS_API_KEY, session tokens, manual fallback), display on public pages/panel/admin/notifications,
       informational capacity ("Brak wolnych miejsc", RSVP not blocked). Full original description in task-description.md.
  status: completed
  tags: [groups, terms, locations, google-places, frontend, backend, migration]
  priority: high


task:
  title: Owner items page, attendee items on event/term pages, event item reservations
  description: >-
    1) New items list page for reviewing a user's/organizer's items: user at /<user-id>/items,
    organizer at /<organization-slug>/items. The items page also shows the owner's nearest upcoming
    term where one can come to pick up/swap; if the owner has no future terms, only chat is possible.
    2) Event and term pages - "Signed up and their items" - show 3 most recently added items with
    "Show more" and a link to the item page. The item page accepts ?term=<term-id> and ?event=<event-id>
    params and shows take / swap buttons to reserve the item, plus "write" (chat).
    3) Implement item reservation on an event.
  status: completed
  tags: [items, events, terms, reservations, frontend, backend]
  priority: null

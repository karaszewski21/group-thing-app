        - "Frontend: src/frontend/src/api/groups.ts (line 2 import, line 110 PublicNeededItemResponse.product_category: ProductCategory) — 14th frontend touch file, backs the public/unauthenticated page (getPublicCircle -> usePublicKragGrupy -> PublicKragGrupyView); needs product_category_id/product_category_name per the same app.groups DTO rename as api/terms.ts."
        - "Frontend: src/frontend/src/components/layout/Sidebar.tsx line 97 — second `hasPluginManagement` gate (`{hasPluginManagement && <PluginMenuItems />}`) not covered by the isAdmin-OR-hasPluginManagement change at line 94; an ADMIN-only principal would see the Plugins nav link but not plugin-contributed menu items."
        - "plugins/server-sdk.ts getProducts (lines 83-88) has the same category-query-param-becomes-no-op regression as plugins/PluginMessageHandler.ts:108 — same accepted/out-of-scope treatment, needs its own Known Limitations line."
      planner_sweep_result: "implementation-planner ran its own independent repo-wide grep sweep before finalizing task groups: confirmed all 4 known_gaps items as real, found no additional undiscovered files. Corrected existing-test tally from spec.md's 13 to verified 16 (6 backend + 10 frontend)."

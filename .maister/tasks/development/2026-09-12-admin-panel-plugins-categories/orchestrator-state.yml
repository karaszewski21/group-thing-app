      primary_language: "Python (FastAPI) + TypeScript (React)"
      summary: >
        Plugin management already exists as a complete, permission-gated backend
        (PLUGIN_MANAGEMENT) with a partial frontend (no Edit/Delete wiring, raw-JSON
        form). Product categories are a closed Python StrEnum, not a DB entity — a
        real Category table was deliberately removed in migration 0006. No ADMIN
        permission/role exists anywhere; auth is a flat Permission enum (READ, EDIT,
        PLUGIN_MANAGEMENT) with no frontend permission-based gating.
    clarifications:
      - "Category management = real CRUD (reintroduce Category entity, reverse migration 0006)"
      - "Admin model = single new Permission.ADMIN, no new UserRoleType"
      - "Admin panel UI lives in existing AppShell/Sidebar, not a new /admin panel-style shell"
      - "Plugin-admin UI gaps (Edit/Delete, JSON form) are out of scope — gating only"
    gap_analysis:
      integration_points:
        - "new app/category/ router+service+schemas+models, mirroring app/product"
        - "AUTHORIZATION_MATRIX new rows (GET->READ, mutations->ADMIN)"
        - "new Alembic migration: categories table, seed 5 rows, backfill products.category_id, drop enum column"
        - "app/groups DDD module (repository.py join + schemas.py NeededItemResponse/PublicNeededItemResponse) — second bounded-context consumer of Product.category, incl. a public unauthenticated endpoint"
        - "frontend: new api/categories.ts + useCategories() hook; 8 existing consumers of utils/productCategory.ts need migration (4 of which submit data)"
        - "router.tsx: categories/ categories/new/ categories/:id/edit siblings; Sidebar.tsx new ADMIN-gated NavItem"
        - "app/auth/models.py Permission gains ADMIN; seed/data migration grants it to dev admin account"
      summary: >
        Risk escalated medium->high. Two corrections/expansions vs Phase 1: (1) frontend
        already decodes JWT permissions via useAuth() — no new mechanism needed; (2) the
        Category FK reversal reaches a second bounded context (app.groups, incl. a public
        unauthenticated endpoint) and requires migrating 8 frontend category consumers, not
        just 2 new admin pages. 4 critical + 3 important decisions surfaced for the user.
    scope_clarifications:
      scope_expanded: true
      summary: >
        Scope expands beyond the locked Phase-1 decisions: Category FK reversal also
        touches app.groups (second bounded context, public endpoint) and 8 frontend
        category consumers (not just the 2 new admin pages).

task:
  title: "Private group join-request/approval flow + PrivateTermView/PublicTermView refactor continuation"
  description: |
    Two related pieces of work on src/frontend/src/pages/krag/TermPage.tsx
    (PrivateTermView + PublicTermView, the group/term screen):

    1. BUG/GAP: A logged-in user viewing a PRIVATE group they don't belong
       to sees "Dołącz na stałe" (join for good), which opens
       JoinPrivateGroupDialog — a form asking for guardian_name/child_count
       and calling POST /api/groups/public/{id}/join, which creates
       IMMEDIATE standing membership (join_private_group). This is wrong
       for an already-authenticated user: it's the same anonymous-guest-style
       form (asks for a name as if the caller weren't already identified),
       and it grants access instantly with no organizer gate. The user wants
       a real request/approval flow instead: the logged-in visitor sends a
       join REQUEST to the group; the organizer sees pending requests and
       accepts (or rejects) them; membership is created only on acceptance.

    2. REFACTOR CONTINUATION: the user has been incrementally refactoring
       PrivateTermView/PublicTermView (see project memory / prior session:
       KragGrupyPage.tsx was renamed to TermPage.tsx, a TermAccessBoundary +
       PrivateGroupAccessDenied component were introduced backed by a new
       GET /groups/public/{id}/access endpoint, and GroupHeader/TermCard/
       FamilyCard/NeededItemsSection/ListingsSection/SwapProposeDialog were
       extracted into src/pages/krag/components/ as shared presentational
       pieces). The user wants this refactor continued/finished to a "good"
       state — exact scope to be determined via codebase analysis + gap
       analysis (current state vs. what "done" looks like), not assumed.

  status: in_progress
  tags: [development, groups, membership, frontend, backend]
  priority: high


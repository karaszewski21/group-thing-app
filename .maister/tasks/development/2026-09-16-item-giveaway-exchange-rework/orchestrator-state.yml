task:
  status_final: completed
  title: "Re-implementation of item giveaway (oddanie) and exchange (zamiana) flows"
  description: >
    Reimplementacja mechanizmu oddania i zamiany rzeczy w ramach terminu zajęć.

    1) Oddanie: dawca wystawia rzecz do oddania; odbiorca (zapisany na termin)
    widzi listę rzeczy do oddania na stronie terminu, klika i w dialogu wybiera
    "Chcę wziąć" - powoduje to blokadę rzeczy w "moje rzeczy" u dawcy. Po
    zakończeniu zajęć obie strony (dawca i odbiorca) dostają notyfikację oraz
    na kaflu rzeczy pojawia się możliwość potwierdzenia ("potwierdź że
    wziął(-a)" / "potwierdź że odebrałeś(-aś)"). Kto pierwszy potwierdzi -
    dochodzi do transakcji: rzecz jest usuwana z magazynu dawcy i dodawana do
    magazynu odbiorcy.

    2) Zamiana: obie strony (dawca/odbiorca) mogą wystawić rzecz do zamiany.
    Jedna ze stron, będąc na stronie terminu, w dialogu z listą rzeczy do
    zamiany wybiera "Chcę" i podaje listę swoich rzeczy, którymi chce się
    zamienić ("Na co chcesz się zamienić"). Druga strona dostaje notyfikację
    + blokadę w "moje rzeczy" + możliwość accept/reject, co generuje
    notyfikację zwrotną. Po terminie zajęć obie strony widzą pytanie "Czy
    doszło do zamiany?" - kto pierwszy potwierdzi, dochodzi do transakcji
    (wymiana rzeczy w magazynach obu stron).

    This supersedes/refines the prior task
    .maister/tasks/development/2026-09-14-lending-exchange-mechanism, which
    left substantial uncommitted WIP in the working tree (circulation +
    groups + panel frontend) that does not yet implement this
    notification/first-to-confirm/accept-reject flow.
  status: completed
  tags: [circulation, terms, panel, notifications]
  priority: null


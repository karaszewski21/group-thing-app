verification_context:
  last_status: passed_with_issues
  issues_found:
    - severity: warning
      id: confirm-transaction-toctou
      description: >
        confirm_transaction's TOCTOU window is closed for the sequential
        race but not a genuinely concurrent one - a true simultaneous
        double-confirm can raise unhandled StaleDataError -> raw 500
        instead of the intended clean TermAlreadyResolvedException 409.
    - severity: warning
      id: swap-proposals-missing-index
      description: "No index on swap_proposals.listing_item_id/offered_item_id, queried on every term-listing view."
    - severity: warning
      id: scheduler-max-instances-undocumented
      description: "APScheduler add_job relies on default max_instances=1 with no comment/assertion documenting it."
    - severity: warning
      id: scheduler-shutdown-asymmetric
      description: "_term_end_scheduler.shutdown(wait=False) is asymmetric with the outbox task's graceful awaited cancel."
    - severity: warning
      id: deleted-item-orphaned-listing-crash
      description: >
        Found and FIXED during manual testing (not part of automated code
        review): deleting an item with an active ItemListingPreference
        crashed the entire public/browse term-listing response with an
        uncaught EntityNotFoundException. Fixed in
        _resolve_item_display_info/_is_item_available to skip unresolvable
        items. Verified: 37/37 affected tests pass, live endpoint 404->200.
  fixes_applied:
    - "deleted-item-orphaned-listing-crash: fixed during manual testing, verified via tests + live endpoint"
  decisions_made:
    - "User chose to skip fixing all 4 code-review warnings (W1-W4) and proceed as-is with passed_with_issues status"
  reverify_count: 0

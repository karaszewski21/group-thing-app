      primary_language: python-fastapi-react-ts
      summary: >
        Existing uncommitted WIP (from prior task 2026-09-14-lending-exchange-mechanism)
        already has solid, reusable circulation primitives (Reservation with
        LEND/RETURN/SWAP/GIFT types, paired SWAP legs, InventoryBalance locking,
        ledger) and a full working notification system (Notification model,
        outbox pattern, notifications_bridge ACL, PanelHeader bell UI) -
        neither needs to be built from scratch. However the WIP's
        take_item_listing flow AUTO-CONFIRMS both reservation legs immediately
        on the taker's action (collapsing propose+accept into one step),
        which is the OPPOSITE of the new spec's required two-party
        lock-then-notify-then-first-to-confirm-wins race, and there is no
        reject/decline operation anywhere (only a blunt cancel). Term gating
        today blocks taking a listing once term.occurs_on has passed
        ("Termin już się odbył") - inverse of the new spec, which wants the
        final confirm/transaction step gated to AFTER the term ends. Frontend
        has real API-backed listing browse/take/fulfill wiring but no
        accept/reject UI, no multi-item swap-offer dialog (only a single
        <select>), and no locked/pending indicator in "moje rzeczy"
        (RzeczyView.tsx). Unrelated WIP pieces confirmed out of scope:
        home_inventory_id migration + WypozyczoneView.tsx + people-router
        endpoint (a separate "borrowed items" display feature).
    clarifications:
      - "Remove existing WIP's auto-confirm-on-take; build genuine lock -> (accept/reject for swap) -> post-term first-to-confirm-wins race"
      - "Lock + notification fire immediately on take/propose action, not deferred to term-end; only the confirm UI is gated on term.occurs_on having passed"
      - "Swap is two distinct stages: propose+accept/reject (pre/during term) then post-term 'did the swap happen' first-confirm-wins finalization"
      - "Leave unrelated in-flight WIP (home_inventory_id migration, WypozyczoneView.tsx, people-router by-account-user-id endpoint) untouched - separate feature"

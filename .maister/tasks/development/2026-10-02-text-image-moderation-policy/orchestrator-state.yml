task:
  title: Text + image moderation policy (sync text, async product images)
  description: |
    Sync text moderation (Bielik-Guard ONNX on VPS A, app/moderation) for: organization name (create + name update),
    group name (create + name update), term description (create/update when present), product name+description (create/update).
    Async product image moderation via queue calling VPS B POST /v1/moderate/image (ShieldGemma-2 scores:
    dangerous, violence, sexual, weapons; VPS A owns thresholds); FE shows MODERATION status while pending.
    Moderate a field only when its value changes; adding a term to an existing group does not re-moderate the group name.
    Sync rejection -> 422 naming the field, no scores exposed. Text moderation failure -> fail-closed for org/group names.
    Consider small blocklist for short names. User language: Polish.
  status: completed
  tags: [moderation, backend, frontend]

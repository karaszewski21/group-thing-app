task:
  title: Handover quick wins (research Phase 0)
  description: >
    Implement Phase 0 ("Quick wins", no schema change) of the handover-reminders research HLD:
    (1) verify production TZ (presence/format check only); (2) Europe/Warsaw domain clock local_now()/utc_to_local()
    replacing naive datetime.now() in every occurs_on comparison, declare tzdata, frozen-clock tests incl. DST;
    (3) take/accept notifications and success sheet include weekday, date, hour and group name; swap accept copy includes the Term;
    (4) term-end scan fires at occurs_on + 2h grace with question copy;
    (5) pending-actions modal mounted app-wide, "Później" = real snooze until next local 08:00 (does not mark read);
    (6) client-side "Dodaj do kalendarza" (Google link + .ics) on take/accept success sheet and item page;
    (7) remove fake e-mail/SMS toggles from Settings.
  status: in_progress
  tags: [notifications, handover, timezone, ux]
  priority: high


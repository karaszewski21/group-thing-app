task:
  title: Płatne zajęcia z linkiem do płatności
  description: >-
    Płatne zajęcia (Term w kręgu). Organizator ustawia cenę (kwota w groszach, waluta PLN)
    i link do zewnętrznej strony płatności. Domyślne wartości na kręgu (Group), z nadpisaniem
    na terminie (Term), tak samo jak default_capacity -> capacity. Zapis na zajęcia
    (TermAttendance) dostaje status płatności (nieopłacone/opłacone), a organizator ręcznie
    oznacza „opłacone” na liście obecności. Uczestnik widzi cenę i przycisk „Zapłać”, który
    prowadzi do zewnętrznego linku. Docelowo płatności mają iść przez własny system (bramka
    płatności i webhook ustawiający status). Model danych ma to umożliwić bez przebudowy:
    metoda płatności jako enum (EXTERNAL_LINK teraz, PLATFORM później), a status płatności
    nie jest powiązany z linkiem.
  status: completed
  tags: [payments, terms, groups]
  priority: null


services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: aj
      POSTGRES_PASSWORD: aj
      POSTGRES_DB: aj
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aj -d aj"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
      # `runtime` exports Bielik-Guard at build time and needs HF_TOKEN set.
      target: runtime
      secrets:
        - hf_token
    # Bring the schema to head on every start (alembic upgrade is a no-op when
    # already current), then hand off to uvicorn as PID 1 so it gets signals.
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8080"
    # Room for the e-mail send job to stop cleanly on SIGTERM (it waits 8 s).
    stop_grace_period: 25s
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://aj:aj@postgres:5432/aj
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Photo upload is disabled until every SPACES_* value is set.
      SPACES_ENDPOINT_URL: ${SPACES_ENDPOINT_URL:-}
      SPACES_REGION: ${SPACES_REGION:-}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
      SPACES_PUBLIC_BASE_URL: ${SPACES_PUBLIC_BASE_URL:-}
      MODERATION_TEXT_ENABLED: "true"
      MODERATION_IMAGE_ENABLED: ${MODERATION_IMAGE_ENABLED:-false}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      # E-mail stays off until EMAIL_ENABLED=true; bell mail also needs
      # EMAIL_NOTIFICATIONS_ENABLED. Empty values read as unset/defaults.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-}
      EMAIL_PROVIDER_API_URL: ${EMAIL_PROVIDER_API_URL:-}
      EMAIL_PROVIDER_API_KEY: ${EMAIL_PROVIDER_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_REPLY_TO_ADDRESS: ${EMAIL_REPLY_TO_ADDRESS:-}
      EMAIL_LINK_SIGNING_SECRET: ${EMAIL_LINK_SIGNING_SECRET:-}
      EMAIL_WEBHOOK_SIGNING_KEY: ${EMAIL_WEBHOOK_SIGNING_KEY:-}
      EMAIL_DAILY_CAP: ${EMAIL_DAILY_CAP:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  # Wants matcher (`python -m matcher`): no ports, no secrets. It waits at its
  # startup gate until the backend's migrations have created the 0099 contract.
  # No healthcheck: python is PID 1, so a process check only repeats "the
  # container runs"; its health signal is the window log line and the
  # `want_scan_markers` marker (architecture.md, 0099 runbook step 7). No
  # `init`: it starts no child processes and handles SIGTERM itself.
  matcher:
    build: src/matcher
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://aj:aj@postgres:5432/aj
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  # Dev-only SMTP catcher for EMAIL_BACKEND=smtp (EMAIL_SMTP_HOST=mailpit):
  # `docker compose --profile dev up -d mailpit`. SMTP 1025 only on the compose
  # network, the web UI on 127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.27.10
    profiles: ["dev"]
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"

  # Next.js standalone server: pages, server metadata, public/ assets.
  web:
    build:
      # Repo root, not src/frontend/ — the frontend's test suite imports the
      # sibling plugins/server-sdk.ts module, so it must be in the build context.
      context: .
      dockerfile: src/frontend/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_started

  # Single origin: /api, OAuth2 endpoints and /.well-known go to the backend,
  # everything else to `web`.
  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./src/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_started
      web:
        condition: service_started

volumes:
  postgres_data:

secrets:
  hf_token:
    environment: HF_TOKEN

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: aj
      POSTGRES_PASSWORD: aj
      POSTGRES_DB: aj
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aj -d aj"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://aj:aj@postgres:5432/aj
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FOOTPRINT_PROBLEM_BASE_URI: ${FOOTPRINT_PROBLEM_BASE_URI:-https://aj.example.com/problems/}
      FOOTPRINT_AUDIT_RETRY_MAX_ATTEMPTS: ${FOOTPRINT_AUDIT_RETRY_MAX_ATTEMPTS:-3}
      FOOTPRINT_AUDIT_RETRY_DELAY_MS: ${FOOTPRINT_AUDIT_RETRY_DELAY_MS:-200}
      FOOTPRINT_AUDIT_RETRY_MULTIPLIER: ${FOOTPRINT_AUDIT_RETRY_MULTIPLIER:-2.0}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      # Repo root, not src/frontend/ — the frontend's test suite imports the
      # sibling plugins/server-sdk.ts module, so it must be in the build context.
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

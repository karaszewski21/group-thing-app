services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: aj
      POSTGRES_PASSWORD: aj
      POSTGRES_DB: aj
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aj -d aj"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
      # `runtime` exports Bielik-Guard at build time and needs HF_TOKEN set.
      target: runtime
      secrets:
        - hf_token
    # Bring the schema to head on every start (alembic upgrade is a no-op when
    # already current), then hand off to uvicorn as PID 1 so it gets signals.
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://aj:aj@postgres:5432/aj
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Photo upload is disabled until every SPACES_* value is set.
      SPACES_ENDPOINT_URL: ${SPACES_ENDPOINT_URL:-}
      SPACES_REGION: ${SPACES_REGION:-}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
      SPACES_PUBLIC_BASE_URL: ${SPACES_PUBLIC_BASE_URL:-}
      MODERATION_TEXT_ENABLED: "true"
      MODERATION_IMAGE_ENABLED: ${MODERATION_IMAGE_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy

  # Next.js standalone server: pages, server metadata, public/ assets.
  web:
    build:
      # Repo root, not src/frontend/ — the frontend's test suite imports the
      # sibling plugins/server-sdk.ts module, so it must be in the build context.
      context: .
      dockerfile: src/frontend/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_started

  # Single origin: /api, OAuth2 endpoints and /.well-known go to the backend,
  # everything else to `web`.
  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./src/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_started
      web:
        condition: service_started

volumes:
  postgres_data:

secrets:
  hf_token:
    environment: HF_TOKEN

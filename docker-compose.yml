services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: aj
      POSTGRES_PASSWORD: aj
      POSTGRES_DB: aj
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aj -d aj"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: builds the real frontend (same builder stage the `frontend`
  # image uses) and copies just `index.html` into `frontend_index` — the
  # backend's public-preview routes (app/system/router.py) inject Open
  # Graph/Twitter meta tags into this file, so they need the actual current
  # build's <script>/<link> tags, not a placeholder. Exits once done; both
  # `backend` and `frontend` wait on it via `service_completed_successfully`.
  frontend-build:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      target: builder
    volumes:
      - frontend_index:/output
    command: sh -c "cp /app/src/frontend/dist/index.html /output/index.html"

  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
      # `runtime` exports Bielik-Guard at build time and needs HF_TOKEN set.
      target: runtime
      secrets:
        - hf_token
    # Bring the schema to head on every start (alembic upgrade is a no-op when
    # already current), then hand off to uvicorn as PID 1 so it gets signals.
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://aj:aj@postgres:5432/aj
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Photo upload is disabled until every SPACES_* value is set.
      SPACES_ENDPOINT_URL: ${SPACES_ENDPOINT_URL:-}
      SPACES_REGION: ${SPACES_REGION:-}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
      SPACES_PUBLIC_BASE_URL: ${SPACES_PUBLIC_BASE_URL:-}
      MODERATION_TEXT_ENABLED: "true"
      MODERATION_IMAGE_ENABLED: ${MODERATION_IMAGE_ENABLED:-false}
    volumes:
      - frontend_index:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully

  frontend:
    build:
      # Repo root, not src/frontend/ — the frontend's test suite imports the
      # sibling plugins/server-sdk.ts module, so it must be in the build context.
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully

  redis:
    labels:
      org.springframework.boot.ignore: "true"
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  presidio-analyzer:
    labels:
      org.springframework.boot.ignore: "true"
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - '5002:3000'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  presidio-anonymizer:
    labels:
      org.springframework.boot.ignore: "true"
    image: mcr.microsoft.com/presidio-anonymizer:latest
    ports:
      - '5001:3000'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  litellm-db:
    labels:
      org.springframework.boot.ignore: "true"
    image: 'postgres:18'
    ports:
      - '5434:5432'
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  litellm:
    labels:
      org.springframework.boot.ignore: "true"
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - '4000:4000'
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
      - ./litellm/presidio_recognizers.json:/app/presidio_recognizers.json
    env_file:
      - litellm/.env
    environment:
      DATABASE_URL: postgresql://litellm:litellm@litellm-db:5432/litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      litellm-db:
        condition: service_healthy
      # langfuse:
      #   condition: service_started
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  litellm-db-data:
  frontend_index:

secrets:
  hf_token:
    environment: HF_TOKEN

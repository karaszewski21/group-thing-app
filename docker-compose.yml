services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: aj
      POSTGRES_PASSWORD: aj
      POSTGRES_DB: aj
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aj -d aj"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: builds the real frontend (same builder stage the `frontend`
  # image uses) and copies just `index.html` into `frontend_index` — the
  # backend's public-preview routes (app/system/router.py) inject Open
  # Graph/Twitter meta tags into this file, so they need the actual current
  # build's <script>/<link> tags, not a placeholder. Exits once done; both
  # `backend` and `frontend` wait on it via `service_completed_successfully`.
  frontend-build:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      target: builder
    volumes:
      - frontend_index:/output
    command: sh -c "cp /app/src/frontend/dist/index.html /output/index.html"

  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
    # Bring the schema to head on every start (alembic upgrade is a no-op when
    # already current), then hand off to uvicorn as PID 1 so it gets signals.
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://aj:aj@postgres:5432/aj
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Photo upload is disabled until every SPACES_* value is set.
      SPACES_ENDPOINT_URL: ${SPACES_ENDPOINT_URL:-}
      SPACES_REGION: ${SPACES_REGION:-}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
      SPACES_PUBLIC_BASE_URL: ${SPACES_PUBLIC_BASE_URL:-}
      MODERATION_ENABLED: ${MODERATION_ENABLED:-false}
    volumes:
      - frontend_index:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully

  # Moderation worker (Bielik-Guard + NSFW classifier on CPU). Opt-in:
  # `HF_TOKEN=... docker compose --profile moderation up` with
  # MODERATION_ENABLED=true; the image build downloads and exports the models.
  moderation-worker:
    profiles: ["moderation"]
    build:
      context: src/backend
      dockerfile: Dockerfile
      target: worker
      secrets:
        - hf_token
    environment:
      DATABASE_URL: postgresql+asyncpg://aj:aj@postgres:5432/aj
      JWT_SECRET: ${JWT_SECRET}
      SPACES_ENDPOINT_URL: ${SPACES_ENDPOINT_URL:-}
      SPACES_REGION: ${SPACES_REGION:-}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
      SPACES_PUBLIC_BASE_URL: ${SPACES_PUBLIC_BASE_URL:-}
      MODERATION_ENABLED: "true"
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      # Repo root, not src/frontend/ — the frontend's test suite imports the
      # sibling plugins/server-sdk.ts module, so it must be in the build context.
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully

secrets:
  hf_token:
    environment: HF_TOKEN

volumes:
  postgres_data:
  frontend_index:
